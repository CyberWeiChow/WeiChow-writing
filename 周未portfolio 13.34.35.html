<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>周未写作集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Noto+Sans+SC:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f0;
      --ink: #1a1714;
      --muted: #8a8278;
      --rule: #d8d4cb;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Noto Serif SC', 'EB Garamond', 'Songti SC', serif;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "kern", "liga";
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><path d='M19.5 2.5a2.4 2.4 0 0 1 3.4 3.4L9.5 19.3 3 21l1.7-6.5z' fill='%231a1714' stroke='%23fafaf7' stroke-width='0.8' stroke-linejoin='round'/><path d='M16.5 5.5l3.4 3.4' stroke='%23fafaf7' stroke-width='0.8'/></svg>") 3 25, auto;
    }
    a { color: inherit; text-decoration: none; }

    /* ============= LIST VIEW ============= */
    .list-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 120px 32px 160px;
    }
    .list-wrap header { margin-bottom: 96px; }
    .list-wrap h1 {
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 0.04em;
      margin: 0 0 12px;
      line-height: 1.2;
    }
    .list-wrap .lede {
      color: var(--muted);
      font-size: 15px;
      margin: 0;
      font-style: italic;
      line-height: 1.7;
    }
    .list-wrap .nav {
      display: flex;
      gap: 28px;
      margin: 28px 0 0;
      padding-top: 24px;
      border-top: 1px solid var(--rule);
      flex-wrap: wrap;
    }
    .list-wrap .nav a {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: color 0.2s;
      padding: 4px 0;
    }
    .list-wrap .nav a:hover { color: var(--ink); }

    section.cat { margin-bottom: 80px; scroll-margin-top: 32px; }
    section.cat:last-child { margin-bottom: 0; }
    .cat-label {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 28px;
      font-weight: 400;
    }
    .works { list-style: none; padding: 0; margin: 0; }
    .works li { border-top: 1px solid var(--rule); }
    .works li:last-child { border-bottom: 1px solid var(--rule); }
    .work {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: baseline;
      padding: 22px 0;
      transition: padding 0.25s;
    }
    .work:hover { padding-left: 12px; }
    .work .title {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.3;
      margin: 0 0 6px;
    }
    .work .desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
      font-style: italic;
    }
    .work .arrow {
      color: var(--muted);
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
    }
    .work:hover .arrow { opacity: 1; transform: translateX(4px); }
    .list-wrap footer.colophon {
      margin-top: 120px;
      padding-top: 24px;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* ============= READER VIEW ============= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 16px 32px;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(8px);
    }
    .topbar a:hover { color: var(--ink); }
    .topbar .center { text-align: center; }
    .topbar .right { text-align: right; }
    .progress {
      position: fixed;
      top: 0; left: 0;
      height: 1px;
      background: var(--ink);
      width: 0;
      z-index: 100;
      opacity: 0.5;
    }

    article.reader {
      position: relative;
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 32px 140px;
    }
    .masthead { margin-bottom: 56px; }
    .headline {
      font-family: 'Noto Serif SC', serif;
      font-weight: 500;
      font-size: 30px;
      line-height: 1.35;
      margin: 0 0 14px;
      letter-spacing: 0.01em;
    }
    .lede {
      font-family: 'Noto Serif SC', 'EB Garamond', serif;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      margin: 0 0 14px;
      font-style: italic;
    }
    .byline {
      font-family: 'EB Garamond', serif;
      font-style: italic;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.05em;
      margin: 0;
    }
    .masthead .rule {
      width: 56px;
      height: 1px;
      background: var(--rule);
      margin: 24px 0 0;
    }
    .reader-body {
      font-size: 17px;
      line-height: 1.95;
      color: var(--ink);
    }
    .reader-body .para {
      margin: 0 0 1.1em;
    }
    .char {
      display: inline-block;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    footer.colophon {
      margin-top: 64px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.4em;
      text-align: center;
      text-transform: uppercase;
    }
    .vert-label {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.18em;
      color: var(--muted);
      opacity: 0.6;
      line-height: 1;
      pointer-events: none;
      display: none;
    }
    .vert-label .en {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      letter-spacing: 0.04em;
    }

    body.theme-news {
      --bg: #efe8d4;
      --ink: #1f1a14;
      --muted: #7a6a52;
      --rule: #c9b890;
    }
    body.theme-news .topbar { font-family: 'Old Standard TT', 'Noto Serif SC', serif; }
    body.theme-news .headline {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 900;
      font-size: 34px;
      line-height: 1.22;
    }
    body.theme-news .lede {
      font-family: 'Noto Sans SC', sans-serif;
      font-style: normal;
      font-weight: 500;
      color: #3a322a;
    }
    body.theme-news .masthead {
      padding-bottom: 22px;
      border-bottom: 3px double var(--ink);
      margin-bottom: 40px;
    }
    body.theme-news .masthead .rule { display: none; }
    body.theme-news .vert-label { display: block; }
    body.theme-news .reader-body { font-size: 15.5px; line-height: 1.85; }

    body.theme-criticism {
      --bg: #f3ede0;
      --ink: #1a1714;
      --muted: #6a5f50;
      --rule: #c8bda5;
    }
    body.theme-criticism .headline {
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;
      font-size: 26px;
      line-height: 1.4;
    }
    body.theme-criticism .lede {
      font-family: 'Noto Serif SC', serif;
      font-style: italic;
    }
    body.theme-criticism .vert-label { display: block; }
    body.theme-criticism .reader-body { font-size: 16px; line-height: 1.95; }

    @media (max-width: 700px) {
      .list-wrap { padding: 56px 20px 80px; }
      article.reader { padding: 56px 20px 100px; }
      .vert-label { display: none !important; }
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <aside class="vert-label" id="vert-label"></aside>

  <div id="view-list" class="view"></div>
  <div id="view-read" class="view" hidden>
    <div class="topbar">
      <div><a href="#/" id="back">← 返回</a></div>
      <div class="center" id="topbar-title"></div>
      <div class="right" id="cat-label"></div>
    </div>
    <article class="reader">
      <header class="masthead" id="masthead"></header>
      <div class="reader-body" id="reader-body"></div>
      <footer class="colophon">— Fin —</footer>
    </article>
  </div>

g）提出的“装饰主义”（Ornamentalism）理论，重新理解米亚作为一种以风格为本体、以装饰为存在基础的主体。通过对米亚服饰风格与感官经验的细读，可以发现其身体并非自然统一的本真存在，而是由颜色、气味、服装与感官生成的“合成体”，一种非人性的幽灵般存在。小说中对“轻质化建筑”的书写，亦呼应了米亚幽灵般的都市主体性。置于全球资本与台湾文化变迁背景下，并结合本雅明与詹姆逊理论，认为米亚超越现代国家主体象征，她以装饰与感官细节缝补历史裂隙，构成对现代性、民族话语及历史书写方式的深刻质询，是一种游离于“正典”叙事之外的异质寓言。", "category": "criticism", "color": "#7d6b56", "file": "zhutianwen.txt"}]};
    const WORKS = {"victoria-peak": "    阴阴的、炎热的下午，一条林荫道笔直地伸向远方，两边的野火花开得极盛，一蓬蓬小花衬在致密的叶上，红得不可收拾。太平山腰，两条轨道绿莹莹地从万木中穿过，时有酒红色的缆车摇摇晃晃地越山上下。二六年由烧煤改成电力后，缆车去了层煤黑的焦壳，汽笛萧萧的呼号不再，只是平静而和缓地运输着乘客，一副安详的神情。\n    三等车厢，铁皮的四方车厢开了一排窗，方便透气的设计，却让热风迎面肆虐。午后两三点的光景，窗外潮气未收，一条腥而烫的舌头。车厢里人挤人，座椅窄得紧，大多数人站着，汗、泪和体液黏得不分彼此，一只蒸熟的铁饭盒，锈腥而温热的梅潮气。好不容易坐下，九藜热得脱了汗潮的丝巾，葡萄紫旗袍衬得皮肤雪白，冒着氤氲的水汽，像热腾腾的牛奶。\n    「这什么天气？」壅之抱怨者。他顾不得礼节，脱了帽子，褪去了长衫、衬衣，剩一件汗衫背心仍叫着热。\n    「香港就这样。」九藜也热，但只闷闷地答。\n    她看见坚尼地道的灯牌亮起来，第一站。象牙白的毛玻璃后面亮起焦黄的灯泡，一层水汽朦朦胧胧的。Kennedy，第七任港府总督坚尼地爵士，亲华派。奇幻色彩的结局——退位后乘搭东方号归国，停靠亚丁时，在红海上逝世。\n    死在红海上。九藜在心里念了两遍。极目远望，窗外的野火花红的一塌糊涂，连成一片。\n    「外面好像一片红海。」她说。\n    「我从没去过红海。」壅之不耐烦地拿帽子扇着风，心不在焉，以为她说那阿拉伯半岛地区的狭长海域，《出谷记》写的芦苇海，听起来到有几分古中国韵味。\n    「你不会去见的。」\n    「我也许会的，」壅之说。「我们可以一起去见。」\n    「和我？」九藜面色不改。\n    「要去自是和你一起的，」壅之讨好地笑，「你要来太平山，我不也陪你来了。」\n    九藜见他扬起像猫的脸，咧嘴笑泛着傻气。这样热的天，说来便也来了。她想起自己从前说他像溪涧吃水的小鹿，今日自己却做了那撞破寂静的猎人。她不忍再提，便转身望了窗外。\n    「花开得这样好，可惜热煞了人。」壅之随她视线望去，闷热的影里，野火花娇艳非常，香气却是幽微的，在火炉子似的车厢里，反而显得清雅。「但我与你是攀条摘香花，言是欢气息。」\n    「阳春二三月，草与水同色。」九藜却心中惘然，补了前两句。「可惜时间是错了。」\n    她却知道壅之不觉深意，他始终是看花是花，看水是水，物我清洁两分。曾子说欲诚其意者，先致其知，致知在格物。格物在致知与诚意之前，是一切的起点。壅之人如天智，可格万物之理，唯独不懂开始错一切便错了。\n    「时间错了又有何妨，香花是真，欢也是真。」壅之向来是不以为意的。\n    「喔，别说了。」九藜几近落泪，壅之不解，才想询问。那昏黄的光晕却移动了，另一块象牙白灯牌亮起来，这块灯牌隐隐有裂纹，但墨色的字迹仍清晰可辨——麦当奴道到了。\n    「没一会儿就两站了，到山顶就好了。」壅之安慰地说，以为她是耐不了暑热。「我陪着你呢。」\n    「是呀，你陪着我呢。」九藜喃喃，「真是热昏头了。」\n    「咱们想办法开心开心吧。」\n    「这花真是美极了，天热成这样，不改清雅。」\n    「你的脸是一朵开得满满的花，圆得满满的月。」壅之逗她，故意油腔滑调地调侃。\n    「样样东西都如此完满才好。」九藜也笑了。\n    九藜又眺望远方，轨道随着山坡起伏，越来越陡峭起来。树林后退，缆车缓缓升高，她觉得很辽阔。壅之凝望着她的侧脸，纤薄的剪影，雪白皮肤。地势升高的缘故，风变得凉爽而新鲜，九藜的丝巾在风里飘摇，是文人画里的兰花叶，舒展的、纤长的一撇。\n    「你是莲花身。」壅之说。九藜一身薄汗，却不显得污浊，直刺的日光在她身上软化了，雾蒙蒙的，像镀了一层金边。他想起刳肉还母，剔骨还父的哪吒，观音以荷叶与藕重塑其身，那样洁净而新的身体，不染因果。\n    「我们这样不好吗，多快乐，不束缚。」\n    九藜只盯着车窗外渺远的一点瞧。她看见南风的形状，在细密的林叶里。\n    「我知道你不在乎的，不过名与分而已。」\n    九藜不响。\n    「真的没什么大不了的。我们可以一起去好多地方，只要你还爱我。」\n    「那以后呢？」\n    「只要你还爱我，我们可以永远在一起。」\n    「你怎么会这样觉得呢？」\n    「我们爱着彼此，不是吗？」\n    永远，九藜想，维持现状，亘古不变的史诗论调。她身体伸长，几乎要倒进白日的雾气里，像是听不见壅之的话。\n    这是四一年的夏天，日本人打向了珍珠港，星加坡、马来亚、菲律宾，一连串的小岛沦陷了，像是太平洋上轻打的一串水漂，消息传来香港，人心惶惶。她也不知哪来的气突然约了壅之上山，在夏天最热的时刻。兵荒马乱的时代，他不过是一个自私的男子，她不过是一个自私的女人，她只要一个名分，维持这危险的平衡。\n    道路突然陡峭起来，九藜觉得自己悬在半空，身体笨重凝滞，像自己背着自己。金属的座椅垫在她身后，磕得生疼，骤然痛呼出声。壅之也发现了她的不适，便将她搂入怀中。\n    梅道站，最陡峭的一段。梅含理爵士，出任总督时在卜公码头登岸时被人射击，但未被击中。他下令继续行程，进入大会堂宣誓成为香港总督。唯一一位曾被意图行刺的港督，简直像唐传奇，她想到这哑然失笑，觉得身体的不适也减轻了几分。一二年，辛亥革命的时代，民族主义风起云涌。枪手李汉勇以「歧视华人」为名的刺杀，言之凿凿，尽管于当时处事不公及歧视华人实在普遍，真实原因众说纷纭，不得人知。然而无论如何，自此，总督改坐汽车。于今日看来，所谓猛士的壮行，也不过是「郑重而轻微的骚动，认真而未有名目的斗争」。\n    九藜觉得一阵发寒，爱情也不过是一场未有名目的较量。壅之说爱情，她懂得——然而只要一个名分，他却闪烁其辞，顾左右而言他。\n    「你知道我要的是什么！」她几乎在怒斥了。\n    「你真的想要吗？我们现在这样不好吗，很多人都这样。」\n    「我也认识许多人做出了决定，」九藜说，「他们活得照样开心。」\n    「难道我们不去做，我们就不爱彼此，不再快乐吗？」\n    「我现在就爱着你。你也知道我爱你。」\n    「你真的希望我们去吗？」\n    「我以为这是最妥帖的做法。」\n    「如果我们去做，那你就不再会心烦了？」壅之说。\n    急坡过去了，言辞激烈的兵刃相见也缓下来，山顶快到了。\n    「如果你要，我们就去做。」壅之一字一拍，语气可以放缓，「对我没关系的。」\n    「什么叫没关系？」\n    「只要我们好好的，我为你做什么都成。」\n    陡峭的山崖过去了，便和缓得一望可见底，「反者道之动也」。九藜突然觉得一阵深深的无力，若不是环境好，保养得当心，她早已经老了——也不需要几年了。青春是不稀罕的，她有过，也快失去了，她快等不起了。壅之字字句句刺得生疼，似乎结婚与否是她一个人的事情。这漫长的挣扎，她已经筋疲力尽、无力延续，她对爱认了输。\n    白加道一过，晃眼便到了山顶。缆车才停未稳，九藜再也无法忍耐，夺门而出。缆车终点站不到太平山顶，遥望可见总督山顶别墅，巍巍的白房子盘桓在东方之珠的顶端，麦当奴任总督时的手笔，权力与财富的象征。三十年代弃用后无人修缮，简直像一座皇陵。下望是原初的山岭——权力所刻意遏制的开发，再远便是这声光电的超级大都市，缆车密密缝合两者，现代性的弥合术，九藜喜欢这参差的对照。\n    暮色苍茫的时刻，车站外面的山，山外面的海，都泛着灰色。太阳横在天边一角，日夜两分，九藜站在山上，觉得自己比太阳还高，太阳老了。夜的影遮了半个港岛，然而那影下的城市照旧歌舞升平，烟囱吐雾的吐雾，船只该靠岸的靠岸，不用看就知道全在那里，就像回忆。\n    「你还好吗？」壅之紧赶慢赶地追来，看见九藜站在山崖边上，一片纤而薄的影，飘然欲仙的姿态。\n    傍晚时分，凉风阵阵，山顶尤其风大，丝巾又被吹起来了。她抓住那飘飞的尾，突然想起古人对风神的崇拜，「星有好风」。人世的事，她崇拜爱情。她要，壅之就给了，这便是男女贞良，世事有自己的好理。\n    于是她说，「我很好。」\n\n", "drifting-water": "亲爱的妈：\n\n第一次发现西湖这样大。\n\n五点结束最后一节课，从学校出发骑车去地铁站，我埋头扎入城市粗大的血管。地铁是没有时空的造物，只有光与暗参差交替，标记着坐标。晚高峰时分，车厢内挤满了人，然而又似乎是空荡荡的——现代人是二维的线，动起来是不占空间的。五号线到七号线，从北由南描着西湖的轮廓一路深入——一个圆润的环。手机通知震动不止，你在家庭群用一张张照片「直播」着西湖的日落——像是催促——一个浑圆黄色的球一点点落下去，一粒火星。\n\n一个小时，西湖的湖水被烧红需要的时间，我堪堪赶到餐厅。一把方桌，你坐在靠湖的一面，瞧见我便嘟囔着：\n\n「等你等得天都暗了。」\n\n我只能含糊其辞：\n\n「原来西湖这么大呢。」\n\n菜已经上齐了，天色将暗未暗的时分，餐厅还没有开灯，只有桌上一盏双环灯发着昏黄的光。你靠过来搂着我，把手机递给服务员，想拍照留作纪念。我却下意识地想要弹开，只能感觉到自己僵硬的身体。\n\n语言忘记了，但身体记得。\n\n你第一次打我的时候，应该是六岁。已经回想不起原因，只记得一个清脆的耳光。厚实而干燥的掌心，你绕环着挥舞拳头，耳光声音响亮，声音比疼痛更让人觉得羞辱。\n\n还有那个雷雨夜，乡下的小房子里，我和爷爷争抢洗澡的顺序。你让我跪下，一个接一个耳光逼我认错——要孝顺。你和雷声一起咆哮，或是说，暴风雨借你之口而宣泄。我咬紧牙关，只是沉默着，但鲜红的巴掌印会说话，我后来和老师撒谎，品学兼优的乖乖学生，慌不择言说是和人争夺篮球场的痕迹。\n\n那一天，我试着第一次顶嘴，「你妈的」。你紧紧抓住手中装菜的蓝色塑料袋，又丢下，压着声音说：「你说什么。」我知道外婆是你的死穴，只是情动时分地口不择言。于是我转身就跑，沿着小区漆黑的小道，你提着裙子，低声重复着听不清的话。昏黄的路灯照在地上，是一个又一个圆，我跑过明暗的分界，一个、两个、三个……跑得忘记了时空，只是绕着小区的人工湖一圈一圈地奔跑，你的喘气声紧紧地跟在我的脑后，像试图咬住自己尾巴的蛇。\n\n那一次，你紧紧攥着我的数学试卷，一根筋从太阳穴滑动到腮帮，你解下绷直的皮带，命令我转过身去。呼啸的风声里，你是拥有绝对权力的君王。我可以想象圆环金属扣如何在身上留下一个个环形的印记，像小路上射灯的投影，一个交替着一个，明、暗，像一次次心跳。\n\n暴力的匣子打开了，就无法关上。沃尔夫写，「一个事件发生了，有结束的一天。作为一个结构，永远不能结束，除非整个社会的结构彻底改变」。暴力是一个永恒不朽的结构。后来在无数次争吵中我逼问你暴力的动机，你沉默良久，然后说：\n\n「我爸是这样对我的。」\n\n妈妈，我们都是一条又一条咬着彼此尾巴的蛇啊。我被你紧紧地咬着，你被外公，追溯而上，永无止境——整个暴力的传统透过辞说与身体紧密相连。我们都受困于“辞说环路”，拉康说的。辞说的环路把你和我整合在里面，语言的承继，是身体的暴力。我们是在这个辞说环路中诞生的，它早在我们出生之前便给我们打上了标记,而且也将继续存在于我们死后。\n\n成长就是继承你的辞说吗？还是挣脱出来？\n\n你后来把合影发给我。天光微暗，背景里的西湖几乎燃尽了，只是翻动着灰暗的水波，像余烬。桌上一盏环形灯暗暗的点着，背光的缘故，两个昏黄的影在镜头的锐化中隐隐挣开背景，看上去有一种不真实的感觉，然而又仿佛是永久长存的，几乎像是两个不死的幽灵。\n\n那一天，你开车接我放学。车上放着王菲的《乘客》，在过门旋律的幢幢和声里，突然间，你喃喃地说：\n\n「我好久没有梦见她了，我快忘了她的样子。」\n\n我知道你说的是外婆。在你的叙述里，她坚韧、勇敢却有时懦弱——和你一样，在我形成记忆前早逝——肠癌——和她的母亲一样。\n\n「我和她越来越像了。」\n\n几乎是相悖的论述。但我知道，你说的是你和她一样，被生活与劳累折磨得疲惫不堪。\n\n我只能沉默。\n\n医生说，肠癌有遗传的概率，来自基因。\n\n一个基因就像一个标记，它早在我们出生之前便给我们打上了,而且也将继续存在于我们死后。「高危群体」，多惘惘的威胁，一个癌症的庞大阴影盘桓于基因的携带者——一个家族的身上，永不止休，几乎像一个华丽的幻觉。癌症也是一个结构吗？只要还有生育，基因的标记就通过身体传播。一代一代人，像无尽的稻田，毕剥毕剥地抽节，结成鞭炮似肥大的穗，但总会有收割的一日。于是你开始害怕体检，注意饮食和休息，你也会恐惧。\n\n「你是个疯子。」雷雨夜，数不清的耳光之后，我颤抖着嘴唇吐出了整个晚上唯一的一句话。你的瞳孔在光下微微收缩，睫毛颤抖起来，然后停下了手。\n\n「你可不可以勇敢一点，像一个『正常的』『男孩子』。」那一天我告诉你那些词，它们被同学抛掷给我——「娘炮，娘娘腔，娘们」。你刚做完饭，餐厅里烟雾袅袅，我们之间像隔了一层雾蒙蒙的纱，我看不清你的表情，只能听见你微微哽咽的声音。\n\n「为什么呢，你为什么不回嘴呢。」\n\n我想和你说，我真的并不在乎。但你已经冲过了那道帷幕，抱着我哭泣，仿佛被词砸中的人是你自己。你把我的脑袋按在你的怀上，似乎想安慰我，我却只记得家烧梅童鱼暖融融的鲜香。妈妈，除了你的泪水，没什么东西可以刺痛我。你是个不像「女人」的妈妈，而我是你的儿子。我们都偏离了这些看似稳固无比的结构，并乐不思蜀。\n\n后来我读巴特勒，「性别是一个麻烦」，她写。「社会建构」「性别表演」……纷繁的后现代理论，严丝合缝的论证，多振奋的话语。然而，在某种程度上，它们是否和「高危人群」一样，只是一场华丽的幻觉，一个空洞的能指。我找不到一种合适的叙事告诉你，我们都不是疯子，是吗？\n\n成长是对结构的一场逃逸吧，是吗？\n\n饭桌上你絮叨着问我学习与生活。千辛万苦地转入专业之后，生活似乎也算四平八稳。阅读，上课，写作或者论文，似乎也无话可说，我只能发给你充当作业的文章。你读了很久，面孔在清蒸江白的袅袅蒸汽里变幻不定，刺耳的沉默，于是你说：\n\n「怎么办？你的文路我越来越陌生。」\n\n我不解其意，只能怔怔地看你，你的嘴唇被肥润的鱼腩细细描过，看起来光亮而润泽，你说：\n\n「但说实话，不怎么触动，觉得匠气。」\n\n似乎是意料之中的回答。\n\n十三岁以前，我读你书架上的书。鲁迅、老舍，时有王小波。在现代历史的断裂里偶遇理性的黑暗面，语气郑重而庄严，为「被侮辱与被损害者」的写作。直至遇见张爱玲。她在有限的空间里语气戏谑，无意做见证者，只是在历史的罅隙里鉴赏世纪末的美学。她甘做本雅明写的「历史的天使」，一手挽住时代巨轮「留住了满清末年的淫逸空气，关起门来做小型慈禧太后」的梁太，书写不过是尴尬的不和谐——「郑重而轻微的骚动，认真而未有名目的斗争」。迷恋词的女性化的男孩，如何抵抗得了张爱玲的鬼魅之力，面对词与句的震动，只能无法克制地临摹模仿。\n\n我只好笑笑，「没事，我从小到大一直都挺匠气的。」\n\n你也无话，觉得失言，只好给我夹菜。江白鱼腹，荔枝虾球，糯米糖藕和大块的东坡肉，面前的碟子很快被密密地垒起来，圆环的骨碟设计，只在中间留了一个空心。幽幽的空洞，漏出下方青色的桌布衬底，在光下隐隐地闪烁着，几乎像一个晶莹的硬核。生活也是围绕这片晶莹建成的，我们小心翼翼地绕过它，不去刺痛它，然而那里什么也没有——只是一片虚无。\n\n「对不起，」雨停的时分，你用冰袋轻轻靠在通红的巴掌印上，火辣辣的脸颊并没有因此好转，你只是试图弥补心中的愧疚，「我只想你快点懂事起来。我实在是太累了。」\n\n然后你带我去海鲜排挡，一桌甲壳动物张牙舞爪，清蒸与家烧做法，香飘满屋，温州人称其为「鲜」。那天你沉默着为我剥了一盘虾与螃蟹，蘸酱油醋吃，鲜美异常。然而我们都忘了酱油与海鲜作为「发物」对伤口的损益，那个青青紫紫的巴掌印在脸上像螃蟹一样张牙舞爪了两周，一个伤口是一个标记，它标记着无法逃离的创痛。我知道你的脸上一定也有一个相似的印子，青紫的掌印，只是它隐在血与肉的下面，历史的地表下面——在你出生之前就有了，死后仍会留存。我只能不断重复着谎言——那个空洞的核，解释着狰狞的伤口，甚至成为对自己的宽慰。\n\n十三岁，我第一次牢牢钳住你的手。你不可置信地看着我的眼睛，但我知道你没在看我，你的目光透过眼眶下的两个空洞，直直地望向身后。你在看谁？看自己吗？你是否想起了那个面对持着皮带的父亲而一声不吭的女孩，她也曾这样直直地凝望她的父亲，一言不发。\n\n「你没有权力打我。」我说。张爱玲写《茉莉香片》——如果她爱他的话，他就有支配她的权力。我不再爱你了，妈妈，爱的语言太痛了。\n\n成长是逃离你的语言。\n\n饭后，我们一起走出餐厅。柳浪闻莺，西湖十景。士大夫三千年的绮梦，都在这紧凑的山水里。我走在前面，你缓缓地跟在身后，像一个疏落的影子。渐渐下起小雨，街灯亮了。射灯的圆形光晕被西湖致密的树林割成无数碎片，希拉啦落了满地狼藉。\n\n「从西湖到地铁站要走十五分钟。」我说。\n\n「是很远呢。」你快步跟上来，以为我在催促。\n\n突然间觉得一阵悲戚。指路与引路，颠倒了我们之间的关系。抻开一整个童年的张力，在微妙的时刻戏谑地翻转。然而又觉得，颠倒的错置，旁逸斜出的「枝」，才是真正的「秩序」。于是明白为什么不爱西湖——十景，几乎是太规整的意象。忧郁的文人墨客，滥情地以与自我直接指涉的方式呈现「景」与「物」。比舞台布景伟大而渺小于名山大川的小湖，蓄满人类的哀乐。\n\n想起来高中时，我们总是给彼此写大段大段的信。无论是控诉或是宽慰，总是句子屈成几折，大段郑重其事的抒情，浓墨重彩的感怀之辞。\n\n人们说，文字是桥梁。然而我以为文字是双面镜，西湖上以湖为镜的忧郁诗人，顾影自怜的抒情诗。我在写给你的信里观照自己的脆弱和创痛，你叙述你的辛劳和无奈，然而写来写去，不过都是给自己看。文字是拉康的镜子，镜中的形象是全能的幻觉，我们在信里可以彼此宽慰，可以言不由衷地谅解创痛。然而我们都知道，这只是「神姬之舞」——不为观众，只为通灵。\n\n「你最近还好吗？」我问，整个晚上第一次提到你自己。\n\n「我很好呀，这岁数了，有什么不好的。」你怔了怔，似乎没想到我的疑问。「你爸也挺好的，你好好学习就行了。」你拉住了我的手，笑了笑。\n\n我低下头，看见我们的手相连的地方变成淡青的竹色。你的皮肤变成光滑的竹纹，莹莹的光泽流着绿意。「咻」声中，你一节一节地拔地而起，抽开颀长的四肢，逐渐长成一丛坚实的从生竹。一双眼睛隐隐闪烁，你的脸庞仍堆着微笑，似是享受生长的喜悦。或许是长得太快而根来不及扎深的缘故，你俯下身倒入湖中。中空的竹心让你平稳地浮在水面——一个坚实的筏，我跳上你的背，像小时候无数次那样，你只是微微一颤，仍稳稳地托住我。\n\n西湖的水位不深，我们只是顺水潮漂流着。微微涌动的水卷来腐了的草木和嬉戏的鸳鸯，一切雾蒙蒙的，只有天水相依。淡绿的柳树，墨绿的湖水，清风徐来，水波不兴。姬妾酥柔的水声里，多少士大夫将忧郁洒进湖里顾影自怜。烟波浩渺的湖是凹陷不平的地层，沉积汇集着四方的历史，我紧紧抓住我的竹筏妈妈，竹筏载着我。我们不知去向何方，没有浆，但只要顺着流水走就好了，总能漂出这看似密不透风的湖，循环的辞说，坚固的核。\n\n妈妈，我们一起走吧。", "carsick-cars": "多多说，晕车是因为，你的身体以为你中了毒。\n\n那天七点方才日落，似乎小镇上时间也长。你和多多挤在公交车最后一排，漆上清漆的车窗意义不明，乌窗如镜，隐隐现出两张模糊的脸。温州的公交车里只有老人和学生，在不自觉中分坐两边。沉默的老者静静地释放着衰老的气息，一条窄小的走道，隔开聒噪的年轻人，一跨过去你就老了，没有商量的余地。参差分明的对照，几乎像一个惘惘的威胁——你还年轻吗？很快就老了。\n\n地势不平一路颠簸，你告诉多多你要吐了，她却盯着你的眼睛，郑重其事地告诉你晕车的原理。呕吐反射挤压泪腺，你隔着泪水凝视着她，只看见一张庄重神情的白脸衬在漆黑的窗子上，几乎像是悬浮的。窗外风声尖啸，突然想起波德莱尔写的，「我的青春一概都是黑暗的风暴」。\n\n你听见多多说，内耳根据平衡感受位移，而眼睛通过画面。大脑认为感官的冲突是一场幻觉，并推断是摄入了毒物，通过诱发呕吐来清除毒素。\n\n如同迷宫的内耳结构，由一系列充满液体的半规管和导管构成。精密的身体系统，五个平衡感受器完美地各居其位，可以探测不同类型的运动——却无法适应这现代的造物。\n\n现代是一种毒素。\n\n她说，我们的生活是一场幻觉，不是吗？\n\n你最后还是没能吐出来，或许是多多判词式的反问深深震慑了你，也可能是司机大发慈悲地打开了通风空调。总之你没吐出来，昏昏沉沉带着两帘泪幕睡去。晃荡的车厢像原初母亲的子宫，时间是透明的羊水，潮湿而闷热地裹住两个现代的婴儿，落日低低地垂着，现代的造物，吹着从清朝刮来的风。\n\n后来你上大学，前往杭城。日常出行仰赖贯穿于城市肌肤之下的地铁。地铁没有时空，只有光与暗参差交替，标记着坐标。金属般冰凉的地下隧道里，你再没有晕过车，却保持着旧时的习惯，紧紧地盯着车厢上的舷窗。地下的隧道空荡一片，车窗几乎是多余的设计，只在到站和出站时灌入亮与暗，提示你，一站，一站，一站，像一次次心跳。\n\n地铁轰隆隆地向前开着，墨黑的隧道，车窗只能映出人们自己的脸。隧道通风的设计刮来大风，是黑暗的风暴。你突然想起来多多的脸，一张苍白、渺小、严肃的脸，漂浮在公交车被涂黑的窗前，说着晕车的原理。你忘记了你自己的脸也在里面，一样的苍白和渺小。\n\n我要吐了。你说。就像多多此刻就在你身边。就像你正坐在那辆小镇的公交车一样。\n\n你在地铁关门预警的提示音里慌忙起身，按照指示牌的指引，冲进了狭小的厕所。你跪在唯一的马桶前面，俯下身去，呕吐。尽管因为赶去家教的缘故你几乎没吃什么，但是为了避免弄脏刚洗的衣服，你仍然尽可能俯下身把头塞进马桶里，与尿渍、阴毛和水垢对视，然后吐出黄色的胆汁，咖啡，和为了维持能量塞进喉咙的小面包。你想起来多多说晕车是大脑用呕吐排出毒素的那个下午，疑心这是否是未清的遗毒。\n\n有时候你感觉到不适才证明你正活着。\n\n或者说，有时候毒素才证明你健康过。\n\n冲水键转动漩涡，你逐渐明白晕车的原因。你明白多多说的从来不是身体，而是「时」与「空」的错置，是两者对彼此的背叛。我们的生活是一场幻觉，它背叛了我们。而你选择抑制大脑的警告，眼角带泪昏昏睡去，并乐不思蜀。\n\n黄澄澄的是胆汁，混着咖啡。没被消化完的小面包絮状地漂浮着，像一株海葵。你记得你和多多一起去逛过景山山脚下的水产店，透过水藻过量繁殖而显得墨绿的水箱，多多指着蓝色照射灯下四伸触手的海洋植物，说，这是海葵。水箱供氧不足的缘故，它们伸着虚弱无力的触角，随水流摇摆而起伏不定。\n\n老板说，海葵可以活1500年。然后踢了踢水族箱角落里的一株，说，知道八国联军来的时候的那个光绪吧，它就是光绪养过的。\n\n你和多多望着那株海葵，好像望着历史。你第一次知道可以用这样的口吻谈论历史。不是感时忧国的负担，勿忘国耻的劝诫，殖民、半殖民，被忧郁的风暴吹进近代的飘摇古国。而是，一株清代的海葵。\n\n你当然知道这是水族馆老板为了卖出一株海葵而无所不用其极，但你深深记得老板那轻描淡写的语气。直到上公交车时，你和多多仍谈着那株海葵，光绪帝的，忧伤而虚弱的海葵。\n\n你们坐在公交车的最后一排，伸长四肢，模仿着海葵。时间是澄清的鸡蛋白，被摇摇晃晃的公交车打发成匀质的泡沫，层层叠叠的立体结构。你在现代的造物里想象清代的水波，清代的风，想象历史，然后和多多笑倒成一团，四肢缠绕在一起，紧紧的，像两株时运不济的海葵。\n\n漫长的傍晚，你醒来时大汗淋漓，窗外暮色四合，公交车的终点站距家千里迢迢，兀离的车站，孤立于欲望的荒漠。\n\n多多已经醒了，没说话，只是远远地望着地平线。公交沿着旧城区一路深入，驶向皮毛高贵的夜晚。瓯海皮革工业区，温州飞腾九十年代的丰碑，如今成为川流不息的欲望遗址。旧城区的中心人民路鲸吞式地吸纳着全温州家庭作坊生产出的皮革料子，这里是重要的生产基地之一。你和多多的父母辈站在时代的风口起飞，却在眩目的现代炫光前忘了自己只是幸运地站在时代风口的「猪」——也终将被时代的筛子筛得流离失所。\n\n大人总语带追忆，在市中心层峦叠嶂的住宅区里辨认曾经名下的房产——「当时说好这两套是你的，那两套给弟弟」，似乎仍持有历史的解释权。梦特娇和阿玛尼，华侨酒店专柜里温州专供的古驰、普拉达、路易威登，都随着时代的落幕下被掩进衣柜深处，只在深夜里发出潮水一般的喘息。\n\n现代的毒素是一场惘惘的幻觉，起飞的经济和杠杆是一体两面的——你今天还富有吗？明天就什么都没有了。上升是忧郁的，起伏不定的股票指数背后是坐着电梯前往天台的小老板，来势汹汹的民营经济往何处去呢？当时代按下冲水键，漩涡卷去泡沫经济破裂后的「呕吐物」——有门路的出国，没门路的偷渡。\n\n多多说，你听得到它们的喘息吗？\n\n过去的历史，生锈是常态。张爱玲末世之音袅袅——回忆像站在古建筑门口向里张望，月光与黑影中，断瓦颓垣、千门万户，一瞥间已经知道都在那里。锈了的重型机器，衣橱深处的奢侈品，是袅袅的未尽之音。它们也是历史吧。\n\n多多说，胃是情绪的器官。呕吐是，身体记得每一点你忘记的东西。\n\n历史是无休无止的书写，是人类用修辞去搬演无数年代无数人类的哀乐。你乘坐在语言的造物上乐不思蜀，但身体告诉你，错了，错了，错了。百转千回的是历史，而现代是打发成纵深堆叠的鸡蛋清，时空的错置是框定的盈余，冲突的感官终将导向呕吐。\n\n你离开厕所重新坐上地铁时，肚子空荡荡的，却觉得心更重了。\n\n你觉得奇怪，和多多每天呆在一起时彼此厌倦，远离时却彼此想念。她苍白的脸在黑色的窗户里频频显影，一次又一次归来，总是那个漫长的不可思议的傍晚。你念，多多。唇部嘟起，舌尖顶住上颚，轻巧而短促的两声嘟囔，也像是撒娇式的乞求——「多一点，再多一点」。\n\n多多，我们如此紧绷而审慎地面对生活。在绿灯闪烁前开始小跑，在车站一遍遍查询实时公交，在卖烟的柜台前踌躇，面对玲琅满目的玻璃柜子心生警惕。似乎生活是百无聊赖的悲喜剧，你长按屏幕便可以倍速播放和跳过。\n\n我们生活在永远延宕的时空吧，多多。像那个永远的漫长的傍晚。\n\n清代的风呼呼的刮着，\n\n刮着那株海葵\n\n它就在水族箱里\n\n长着\n\n好像整个历史\n\n整个历史的忧郁\n\n都长在一株海葵身上\n\n像那个漫长的傍晚\n\n血红的太阳低低地垂着\n\n让两个现代的婴儿睡着了\n\n像公交车上\n\n多多说，\n\n晕车是生活背叛了我们\n\n像你一个人\n\n埋头扎入城市的粗大血管\n\n在厕所里呕吐\n\n就是那株海葵\n\n长着，久久地长着\n\n一千五百年\n\n清代那年的风吹着", "china-ma-fund-2024": "全文共4614字\n预计读完需10分钟\n\n近日，A股上市公司并购重组开启加速度，半导体、新能源等行业成为被并购的热土。公开信息显示，仅四季度以来，就有11家A股上市公司公布了并购重组方案，包括华峰化学、天地在线、华康股份、阳谷华泰等。\n并购重组正在成为监管和上市公司、中介机构共同期待的方向。\n11月9日，以“科技创新与上市公司价值投资”为主题的2024（第10届）中国并购基金年会在苏州举行，数百位知名专家学者、企业家以及顶级并购与基金机构的业界人士出席参会，共同探讨在新的市场环境下，以创新驱动并购活动，实现企业可持续发展的可能性。\n\n一、初冬的“春景”\n\n立冬至，轻风揉碎暖阳细细密密洒在金鸡湖上，一片波光粼粼。步入会场，亦暖融如春。\n中国上市公司协会副会长孙念瑞在开场致辞中即分享了一组数据：“2024年前三季度，我国境内股票市场上市公司合计实现营业收入52.64万亿元，净利润24.43万亿元。5368家上市公司中共有2947家公司实现营收正增长，2149家公司实现净利润正增长，1708家公司实现营收、净利润双增长。4127家上市公司实现盈利，盈利面近八成。”他还特别提到，前三季度A股上市公司研发投入达1.10万亿元，同比增长3.9%，且研发投入超百亿元的企业开始出现，“目前的形势下，拿出真金白银投入研发，是上市公司发展的趋势，也是一个积极信号。”\n“我们今年也特别做了并购重组的民意调查，在对上市公司的抽样调查中，我们发现，新能源、人工智能、医药成为最受欢迎的三大并购标的。”孙念瑞谈到，近年间，新能源产能过剩的市场的共识，但上市公司45%的并购标的需求依然是新能源，且其中链长、链主企业居多。\n今年，国务院发布了新“国九条”，而后，证监会“科八条”“并购六条以及中长期资金入市等“1+N”政策体系渐次落地，“我想，上市公司科技含量和投资价值将得到进一步提升，资本市场也将进一步实现高质量发展。”孙念瑞说。\n金融博物馆理事长、全球并购公会创始会长王巍也特别点赞“并购六条”，在他看来，这一轮经济启动的第一声号角就是“并购六条”，“良好的并购生态至少需要三大支撑，其一是并购市场的主体——中国的企业家们，需要在市场中发挥自己的创新能力活跃市场；其二是监管，需要建立一个公平公正、可预期的秩序空间；其三是社会中介力量，包括协会、律所、投资银行、媒体等需要共同发力，市场才能流动起来。我很期待，‘并购六条’能够为中国市场带来新活力。”\n以此为引，王巍也总结了“民间六条”，并格外诙谐地表示想“蹭”个“并购六条”的热度，包括建议监管者制定明确的底线与框架，让创业家企业家在框架内充分发挥自身主观能动性；建议建立监管者和企业家平等沟通的渠道，让自上而下的指导与自下而上的反馈流动起来；建议建立民营企业特别是中小企业的融资平台，让数万亿新增社会资本投入更有效率的领域等。\n“我看到，‘并购六条’发布一个多月来，并购浪潮正在兴起。而我们，不能躺赢。这是并购公会、并购人的精神。在任何情况下，对国家有信心。”王巍说，他还在分享的结尾处，引用时代金曲歌词——“不要理会，别人是看好或看坏，只要你勇敢跟我来，许多奇迹我们相信才会存在……”\n\n二、并购、创新双向驱动\n\n这是上海市原市委常委、常务副市长，上海新金融研究院理事长屠光绍第7次参加中国并购基金年会。他认为，科技创新既需要在新兴领域发挥引领作用，形成发展新动能，也需要在传统产业、企业改造提升中发挥作用，促进经济结构不断转型升级，“在这一过程中，并购至关重要。”\n“并购是资本市场最核心的功能，但围绕科技创新的并购与传统并购不同，会带来一些新的变化。我们需要用并购驱动创新，也需要用创新驱动并购。”屠光绍谈到，市场关注企业的科技创新，往往更多关注研发投入、科技成果转化以及产业化，“但我们也要关注，以外部方式如并购等实现科技创新的趋势也正在形成。”\n在屠光绍的观察中，越来越多企业在对外并购时，也开始关注“早”和“小”，甚至并购孵化器阶段的小微企业，而更值得关注的是，部分仍在孵化阶段的企业，也开始并购大企业，这两种现象是并行存在的，“而且我们看到，已经有很多成功案例出现。”\n例如荣芯半导体有限公司，其成立至今仅3年，但在创立之初就拿到百亿投资，而其创业的第一件事即以12.8亿元并购业内企业。\n“从荣芯的血液来说，我们天然对并购有兴趣，也有并购精神，但无论是建工厂还是买工厂，本质都是练好内功，必须跑得比行业更快更好。”在荣芯半导体董事长吴胜武看来，创业者必须思考三个问题，其一是钱从何处来，其二是技术从何处来，其三是客户从何处来，“如今，我们通过并购与自我发展，已经集聚了千余名专业人才，这就是我们的‘井冈山’，未来，我们计划10年投资1000亿元，不断以资源整合、练好内功，实现发展与扩张。”\n吴胜武谈到，当前，中国半导体行业集中度还很低，美国股票上市公司中，半导体公司有98家，其中有15家市值在千亿美元以上，而中国虽有158家半导体上市公司，但其中市值超百亿美元只有8家，这种集中度很不符合行业发展规律，“但现在百花齐放、百家争鸣是对的，但未来一定会越来越集中。而未来十年，我想，我们要么在去并购别人的路上，要么在被并购的路上。”\n当前，投早投小投硬科技已成风投市场的共识，但因为退出机制不完善，对赌协议高频出现，“从去年到今年上半年，上交所IPO企业至少有60%签过对赌回购协议，形成了对赌回购困境。为什么会这样？”屠光绍表示，当前要优化创投生态，并购至关重要，并购市场与资本市场“含科量”的提升也至关重要，“中国有5000余家上市公司，这是国内企业中最先进的群体，但对比发达国家，他们的‘含科量’还远远不够。如何提升？需要更多围绕‘新质生产力’的并购。”\n屠光绍再次提起“并购六条”，并表示其对资本市场、上市公司围绕科技创新的并购具有重要意义，也将有益促进资本市场“含科量”的提升，“很多上市公司通过并购科技标的，能够优化自身可持续发展能力；同时，许多科技创新能力极强的企业，也可以反向并购，进入资本市场。让更多资源向优秀企业集聚。”\n“不过，并购本身是难度极高的交易，围绕科技创新的并购，包括科技资产、数据资产、碳资产等的定价，对并购提出了更多新的挑战，需要有更多新的应对。”屠光绍说。\n中国建设银行原董事长王洪章同样为“并购六条”点赞，他特别关注“耐心资本”在并购重组中不可替代的战略价值，他谈到，耐心资本致力于追求长期的投资回报、愿意承受短期市场波动，呈现出深邃的投资远见和稳健的投资理念，“相较于短视的投机性资本，耐心资本更加注重企业的基本面分析和长期价值挖掘，能够更有效地支撑实体经济的稳定发展。”\n以集成电路产业为例，我国于2014年设立了国家集成电路产业投资基金（简称“国家大基金”），采取市场化运作的方式，引导和撬动了数千亿社会资本投入集成电路产业，支持了一批骨干企业做强做优做大，为我国集成电路产业的整体跨越式发展作出了重要贡献。截至2024年5月，国家大基金已设立三期，总注册资本超过5000亿元。\n“我们经济发展面临着挑战。尽管我们在发展、壮大资本方面取得一定的进展，但是无论在规模和质量上和发达经济体相比较，差距是非常明显的。”王洪章对比发达国家，指明了我国耐心资本发展面临的挑战：股民换手率过快，各类资本长期投资的意愿有待提升，国家投入基础设施和基础研究的经费需要进一步增加，现有的科技产业形成的循环体系需要进一步健全，“科技-产业-金融”循环体系亟待进一步打通。\n为解决相应问题，他提出五项建议，包括建议发展具有一流水平的投资银行，强化长期导向，加强投资者教育，健全创新科技成果转化机制以及拓宽资本退出渠道等。\n上海国投副董事长、原上海市金融办主任、浦发银行原董事长郑杨同样以发达国家回观中国，围绕“借鉴发达国家经验，做好科技金融大文章”主题，为形成具有中国特色的科技金融服务模式给出了比较得出的经验结果。\n“以德国、美国和英国为例，德国通过政策性银行与商业银行合作，实施风险共担，推动中小企业和科技企业的成长。”郑杨以具体实例为中国发展提供了观己之镜，“德国的德国复兴信贷银行（KFW）占市场总贷款的30%，并通过风险共担的模式支持超过350家中小企业和1万多家科技企业。美国则依靠强大的多层次资本市场和投贷联动机制，支持超过58万家科技企业，风险投资市场规模达到1.2万亿美元，占全球市场的50%。英国则通过资本市场与政策性银行的结合，吸引了约100亿英镑的风险投资，仅次于美国，位居欧洲第一。”\n针对中国国情，特别是长三角地区，郑杨提出了服务本土需求的策略。他提出要持续加强系统化设计，金融部门需统筹谋划，做好全面布局。同时，要通过资源整合，发挥先导产业基金的作用，促进科技创新，拓宽资本退出渠道，支持企业发展。\n郑杨表示，要重视风险防范，特别是针对科技企业的评价体系建设和跨界监管，并建议在投资端建立科学的风险防控机制，避免无序竞争带来的风险，确保科技金融健康有序发展。\n\n三、金融界应更关注AI发展\n\n在AI崛起的时代，世界正迎来技术与社会深度融合的关键时刻。人工智能的迅速发展不仅改变了产业格局，也影响了日常生活和人类关系。著名经济学家、横琴数链数字金融研究院学术与技术委员会主席朱嘉明与微软（中国）首席技术官韦青进行了关于人工智能与技术创新对经济形态、社会生活的深远影响的主旨演讲，分别从不同角度解读了AI和新技术的崛起以及创新如何重塑科学技术与人类社会的未来。\n朱嘉明在讲话中回顾了ChatGPT发布两周年的历程，并展望了未来AI的发展方向。他表示，AI正在加速科学边疆的拓展，尤其是对基础学科和跨学科的改造，“以英伟达为例，其市值已接近广东省和江苏省GDP的总和，‘AI即资本’的时代已经到来。”\n朱嘉明特别提到，AI不仅在物理、化学和生物学领域引发革命，还拓宽了人类感知的多维物理世界。例如，HAI（以人为本AI研究院）联合创始人李飞飞提出的“空间智能”概念，正逐步让机器具备在三维空间和时间中感知、推理和行动的能力，这一突破有望推动太空开发和基因工程等宏观和微观世界的进一步探索。\n “从PayPal到DeepMind、OpenAI，硅谷的科技、资本和权力三者的结合，正在加速AI技术的发展与应用。尤其是马斯克等人的推动，意味着未来在AI领域的突破将不断挑战传统物理规律。”朱嘉明谈到，AI正主导系统性“破坏性创新”，不断推动着经济形态的转变，“以国际作为参照系，我们差距相当巨大，作为金融界的一份子，大家应该关心人工智能发展。”\n与此同时，微软（中国）首席技术官韦青从技术与社会的角度进行了深入分析。他不仅探讨了AI的技术落地，更剖析了人类智识的演变与人类在快速变化的时代中如何重新定义自我。\n韦青格外关注创新与技术发展的双刃剑效应：“虽然技术迅猛发展，但它并不自动带来社会的整体幸福，尤其是当技术发展加剧贫富差距时，社会结构的失衡可能导致更多的社会问题。”他说，技术的进步并不意味着社会的整体幸福，技术所带来的好处并不均衡，贫富差距的加大往往伴随着技术进步，“因此，人类福祉应始终是技术发展的核心驱动力，而非仅仅追求技术本身的进步。”\n“我们已经进入了信息文明时代，技术的进步不再仅仅局限于物理生产力的提升，它开始重新定义社会结构和人的角色。”回顾文明的发展史，韦青认为技术的进步与人类的认知是同步提升的。然而，在进入信息文明的新时代时，技术所带来的变革已不再是单纯的物理生产力的提升，而是对社会和人的本质的重新定义。他警示，信息技术和人工智能的发展使得机器的能力越来越强，但如果人类过度依赖技术，可能会失去独立的判断力和创新能力，最终成为机器的附庸。\n韦青表示，未来的竞争不仅仅是知识或信息的竞争，而是如何在人机协作中保持创新能力，并能有效解决实际问题。他提到，虽然人工智能在某些领域展现出强大的数据处理和分析能力，但它无法完全替代人类在情感、创造性和道德判断上的优势。技术应当成为人类创造力的延伸，而不是取代人类的工具。作为“人”，我们要不断突破已有认知，迎接“新”的到来，“笃行之，行胜于言，更胜于空想。”\n年会落幕，恰是黄昏，霞光瑰丽，一如会上那些关于资本市场与科技发展的未来构想。\n正如与会者所言，在科技驱动并购，并购驱动创新的进程中，中国经济与资本市场必将迎来新一轮的跨越式发展。", "new2": "全文共2527字\n预计读完需6分钟\n\n又有90后浙商北上敲钟！12月26日，由温州90后“掌门人”方高远执掌的方正阀门(920082.BJ)在北交所上市，上市首日高开498.3%。截至发稿，公司股价上涨399.43%，报17.53元/股。\n\n一、阀门行业“小巨人”自主研发世界领先\n\n方正阀门成立于2004年，注册地位于浙江省温州市，是一家专注于阀门设计、制造与销售的国家高新技术企业，系国家专精特新“小巨人”企业。自成立以来，方正阀门始终注重技术创新，截至2024年6月30日，已累计获得14项发明专利和117项实用新型专利，体现了其在行业中的技术优势，并荣获“国家知识产权优势企业”称号。近年来，方正阀门在保持技术领先的同时，核心产品——球阀和闸阀的销售额持续稳定增长，毛利润逐步上升，2024年分别达到33.07%和19.35%，为公司业绩的提升提供了有力支持。根据市场预测，2024年我国阀门市场规模已达151亿美元，预计到2025年底将增长至171亿美元，年均增长率稳步提升。尽管市场前景广阔，目前我国阀门行业的高端化进程仍有较大提升空间，高端阀门多依赖进口，进口阀门在市场中的占比约为20%。数据显示，2022年我国进口阀门及类似装置的市场规模达到82.6亿美元，高端市场的替代空间广阔。\n阀门的需求主要集中在石油化工、电力、水处理和城市轨道交通四大领域。方正阀门在石油天然气和化工领域的业务占比持续扩大，2023年这两个领域的收入合计占主营业务收入的81.14%，成为公司业绩增长的重要引擎。业内人士认为，随着全球能源需求回升及下游行业的持续发展，方正阀门有望进一步提升市场份额和盈利能力。但值得注意的是，石油天然气行业的景气波动、贸易政策的变化以及技术创新的风险，仍可能对公司的经营产生一定影响。在复杂的宏观经济环境下，方正阀门展现了强劲的韧性。根据招股说明书显示，从2020至2024年上半年，公司分别实现营业收入6.17亿元、4.51亿元、6.16亿元、6.79亿元和4.06亿元，归母净利润分别为0.64亿元、0.23亿元、0.43亿元、0.61亿元和0.37亿元，展现出稳健回升的增长趋势。\n\n二、两代人的一个梦\n\n方正阀门的历史可以追溯到1992年。彼时，创始人方存正在永嘉创立了永嘉县配套阀门厂，这家不起眼的小厂正是方正阀门的前身。2004年，通过股权转让及设立等方式，方正阀门正式成立，逐步成为国内阀门行业的领军企业之一。作为创始人，方存正不仅奠定了企业的技术和市场基础，还长期掌控公司绝大部分股权。方正阀门的上市梦始于2017年。在方存正的带领下，公司启动了A股上市计划。2019年12月，方正阀门整体变更为股份有限公司，准备向资本市场迈出实质性步伐；2020年7月，公司与浙商证券签订了上市辅导协议。然而，就在上市冲刺的关键阶段，2020年11月，创始人方存正因病逝世，给公司带来了巨大的冲击。方存正去世后，他持有的71.36%公司股权的继承问题成为焦点。根据法律规定，这部分7850万股股权为其与配偶苏小英的共同财产，其中50%归苏小英所有，其余50%为遗产，法定继承人为苏小英及其子方高远、方品田。然而，2020年12月11日，方高远与方品田签署《放弃继承权声明书》，宣布放弃对父亲遗产的继承权。此后，这些股权由苏小英继承。不料，短短半个月后，苏小英与两兄弟签署《赠与合同》，将其持有和继承的全部7850万股股权无偿赠与方高远与方品田。最终，两人平分股权，方高远受赠4475万股，方品田受赠3375万股。这一系列操作使兄弟二人直接持有公司股权比例均达到44.69%。随后，两人签订《一致行动人协议》，正式成为公司的实际控制人。\n在兄弟二人的带领下，方正阀门重拾父辈未竟的上市梦。2023年12月18日，公司向北交所提交IPO申请。不到一年后，2024年11月8日，北交所官网宣布，方正阀门集团股份有限公司IPO申请通过上市委员会审议。11月26日，方正阀门在北交所正式上市，朗朗钟声之中，两代人的上市梦终于实现。作为国内阀门行业的重要企业，方正阀门在技术研发和市场拓展方面已取得显著成就。然而，股权继承的“戏剧性”变化和复杂的资本运作，曾一度引发市场与监管的关注。在未来的资本市场中，如何强化公司治理、提升透明度，将成为方正阀门能否持续发展的关键。两代人的梦想已经实现，但上市，仍只是起点。\n‍\n三、从县城小厂迈向全球舞台\n\n当温州90后方高远站在北交所的敲钟台上时，不仅象征着方正阀门的上市梦终于实现，更是与中国阀门行业历史相互印证。从父辈的坚守到新生代的突围，方正阀门的创业故事正是中国阀门行业七十余年“从无到有、从小到大”的缩影。中国阀门行业的发展历程可追溯至20世纪50年代初期。在初期阶段，主要生产简单的阀门，使用低级别、低强度的材料。经过十多年的发展，到上世纪80年代，国内阀门生产能力显著提升，能够制造600多个品种系列，2700多个规格的阀门产品。然而，仍缺乏设计和生产高参数、高技术含量阀门的能力，以满足国内基础工业需求为主。进入90年代，亦如方正阀门的前身，温州、台州等地的中小企业凭借成本优势和灵活的市场反应迅速崛起，填补了国内市场的空白。从全球来看，近年来以中国为代表的发展中国家对于工业阀门的需求呈现高速增长趋势。这主要得益于工业化进程的加速以及基础设施建设的扩张。同一时期，西欧和北美发达经济体则更多地聚焦于现有设施的维修更换和升级改造需求。供需双轮驱动下，全球工业阀门市场呈现快速扩张态势。根据GIA的统计及预测，2021年全球工业阀门市场规模突破750亿美元，并预计2026年有望达到923亿美元。近年来，随着政策支持和行业升级，阀门企业在技术研发上不断取得突破。以方正阀门为代表的企业一路研发突破，获“专精特新”小巨人称号，荣获“国家知识产权优势企业”荣誉，这种从“追赶”到“赶超”的转变，这不仅是企业的拼搏，也标志着行业整体在全球价值链中的不断攀升。当前，阀门作为工业设备的重要组件，广泛应用于流体控制系统中，通过调节和阻断介质的流动，实现设备的安全、稳定运行。阀门行业在石油化工、电力、冶金、水处理等领域发挥着关键作用，其性能直接影响到整体系统的运行效率与安全性。随着制造业的不断升级和下游行业的复苏，阀门行业正迎来新的发展机遇。智能化与绿色化成为行业发展的关键词。随着“中国制造2025”、“新型工业化”等战略的深入实施，下游行业的快速发展，阀门行业市场需求持续增长。特别是在石油化工、电力、水处理等领域，对高性能、高可靠性的阀门产品需求日益增加，这对阀门制造企业提出了新的要求，也带来了新的机遇与挑战。从县城小厂到全球市场一员，中国阀门行业正在经历转型与发展。随着产业升级与下游需求的增长，阀门行业正面临内生与外生动力的双重驱动，我们相信，这仅仅只是开始。", "elieen-chang": "内容提要：张爱玲的小说《怨女》作为其转回中文写作生涯的转捩点，具有丰厚的解释空间。通过结合瓦尔特·本雅明的历史哲学（神学）进行分析，本文认为张爱玲书写的历史成为一种现代性叙事的批评。张爱玲作为“历史的天使”，以家庭与社会的压迫为背景，书写“被征服者的历史”。更进一步，在其跨语、跨文化的书写中，张爱玲构建了一种“另类现代性”，以颠覆性的修辞展现了个体在现代性框架中的复杂挣扎与多重面向。\n\n关键词：张爱玲；《怨女》；本雅明；历史唯物主义\n\n十九世纪五十、六十年代，张爱玲曾用英文创作了三部小说《秧歌》（Rice Sprout Song）《赤地之恋》（Naked Earth）《怨女》（The Rouge of the North），并分别自译成中文发表。于前者，张爱玲自言《赤地之恋》是“授权”之下写就，“她非常不满意”[1]。学界已有推断，认为是张爱玲1952至1957年间滞留香港时，应美国新闻署邀请，书写而成。[2]《秧歌》的创作背景至今议论纷纷，未有定论。《怨女》则“大器晚成”，直到1967年才在英国出版。\n《怨女》写作之际，夏志清《中国现代小说史》（A History of Modern Chinese Fiction）已于1961年首次出版，成为西方学院内现代中国文学研究的扛鼎之作。在他的文学史中，张爱玲被赋予了极高的评价，可与詹姆斯·乔伊斯（James Joyce）、托马斯·曼（Paul Thomas Mann）、陀思妥耶夫斯基（Достоевский）等文学巨擘相比，《金锁记》更是被誉为“中国从古以来最伟大的中篇小说”[3]。此时，张爱玲已离港赴美，摆脱了政治任务的桎梏，远离夏志清所言“感时忧国”（obsession with China）[3]的旧大陆，张爱玲重返其最富洞察力的叙事领域——个体叙事，在商业市场的期待、文化身份的焦虑与双语创作的张力之间，她交出了《怨女》作为答卷。\n然而，The Rouge of the North出版之后反应平平，未能在英语市场中获得预期的成功。张爱玲自译回中文，在《星岛日报》连载的《怨女》却大受欢迎，畅销港台。同时，张爱玲经历了爱人赖雅的亡故。多重打击下，张爱玲彻底放弃了英文写作，转回中文世界。若将《怨女》作为张爱玲写作生涯的转捩点，它标志着张爱玲在生活与写作中的尝试与挣扎，也渗透了她对历史、文化与女性命运的深刻思考。正是这种复杂的多重意义，使《怨女》成为理解张爱玲创作的关键文本。\n\n一、被征服者的历史——从《金锁记》到《怨女》\n\n张爱玲的《怨女》以银娣作为主人公展开，银娣嫁给了佝偻、失明的姚家二爷，从上海的娇俏小姐嫁入烟台的姚家“嫡系”，自此便开始了一步步沉沦与堕落，直至成为一个怨毒刻薄的“太后”。然而这沉沦是清醒的，是“那么长，永远没有完，两条大蛇有意无意把彼此绞死了”[4]。张爱玲一惯地使用“参差的对照”作为书写的不二法门，战争、革命永远是时代的底色，庞大的姚家，坐在云端“老而不死”的老太太，终是随着民国一寸寸陷落了。银娣赶走了求爱的三爷，用青春换回来了一栋鬼气森森的老宅，在袅袅的鸦片烟雾中，守着儿子与首饰，直至自己也成了“死在屏风上的绣鸟”。\n细察可见，《怨女》在叙事结构与人物心理发展脉络上与《金锁记》呈现出高度的同构性，皆以传统家族制度下的女性为中心，描摹其由对现实的强烈不满与反抗情绪出发，最终演变为极端自利、自我封闭的主体姿态。1966年中文长篇小说《怨女》在香港《星岛日报》连载之初，主人公的名字更是直接为“曹七巧”。司马新钩沉史料，发现张爱玲“曾将《金锁记》改写成英文小说Pink Tears（《胭脂泪》），但被美国出版商退稿”[5]。1967年，张爱玲又将《粉泪》改写成英文小说Rouge of the North（《北地胭脂》），终是英国的凯塞尔出版社正式出版。\n吊诡的是，张爱玲为何要重复地书写一个女性在历史的罅隙里的故事。她的书写甚至横跨双语、四地（美国、英国、上海、香港），在24年里，用两种语言书写了数遍。王德威认为，张爱玲不断重复，在于为她的始原创伤（trauma），找寻自圆其说的解释。再进一步，也只是“隐向写实主义一对一式重现本真、直言无碍的写作信念,投下变数”[2]。笔者以为，张爱玲根本不是在书写小说，她是在书写历史——书写本雅明所言“被征服者的历史”[7]。\n《怨女》虽然以小说的形式呈现，但其创作早已超越了传统意义上小说的范畴。她的笔触穿透个体与家族命运的表层，将时代底色与历史罅隙交织成一幅隐秘而深邃的历史图绘。在张爱玲的叙述中，历史并非宏大叙事中的风云际会，而是日常生活中的细枝末节。如果我们将奈格里在《超越帝国》中的后殖民批评——“权力渗透到了生命中，包含了构成生命的所有事件”[6]中的“权力”置换为“历史”，便可一窥张爱玲创作的蹊跷——历史渗透于生命的每一个微末细节之中，包含了构成了生命的所有事件。\n《怨女》书中银娣同时代的世界西端，本雅明在二战纳粹的阴云之间书写了最后的著作《历史哲学论纲》。巧合的是，根据《本雅明传》的作者布罗德森（Momme Brodersen），《历史哲学论纲》的出版与《怨女》经历了相似的命运：\n这部作品在本雅明去世后的1942年由社会研究所出版，题为“纪念瓦尔特·本雅明”（法文版），这书只卖出了很少的几本……1950年，更多的读者在《新评论》上才看到此文的德文版。[8]\n本雅明于逃亡中勾连历史唯物主义与犹太神学。通过瓦解传统的线性时间观，本雅明揭示了隐藏在“过去”中的革命性力量，赋予了历史新的动能。文中提出，“被征服者的历史”是指那些被忽视、被压迫的群体的历史。而历史学家的任务是“从遗忘中拯救被压迫者的记忆，将被遗忘的过去重新激活并赋予其新的现实性”[9]。\n张爱玲的作品正是这种“被征服者历史”的书写。银娣、曹七巧的悲剧，正是历史进程中女性的悲哀。她们作为传统家庭中的女性，面对的不是一个单纯的父权制家庭压迫，而是整个社会历史和文化背景下的压迫。张爱玲不断地书写，甚至到头来发现中文作为社会的表意结构也不再值得信任，寻求英语作为书写的媒介。\n在跨国、跨语的书写策略之中，张爱玲发现了如“念珠般成串”的历史中无尽的断裂，正如周蕾所论述的那样，它威胁着五四小说家们构想的“内在的主体性”和“新国家/民族”之间的同一性。[10]张爱玲笔下的七巧和银娣鬼气森森地出现，是古中国一次又一次在新时代“借尸还魂”。她们嘲笑这种同一性修辞的进步性。她们似乎在说：这新的历史叙事机制的技术还无法正常运行，因为封建中国的枷锁仍牢牢束缚在她们的生活中，深深嵌入她们的命运与意识里。\n以此观之，张爱玲俨然成了历史学家。她不仅是过去的叙述者，更是本雅明所言“末日审判”的代理人[7]，在当下的斗争中完成过去未竟的任务。张爱玲从遗忘中拯救被压迫者的记忆，将被遗忘的过去重新激活并赋予其新的现实性。这种“救赎”不仅仅是对过去事件的简单回溯，它更是一种对过去进行创造性重构的过程。张爱玲通过对“细节”的精雕细琢，将历史中的那些无声的痛苦、沉默的挣扎重新呈现出来，并赋予其新的语境与解读，去颠覆历史的宏大叙事。\n从曹七巧到银娣，从张爱玲本身的“家庭罗曼史”（family romance）到中英间的“自译”，张爱玲笔耕不辍。《金锁记》中七巧为保住钱、权不惜一切代价，自觉地“带上黄金的枷锁”——干涉儿女婚事，哄儿子吃上鸦片，虐待儿媳。而《怨女》删去了七巧在分家后驱逐侄儿、虐待自杀等情节，行至《怨女》文末，银娣甚至金银盈屋、子孙满堂——世俗意义上美满的结局。然而结尾：\n她（银娣）不由得想起从前拿油灯烧一个男人的手，忽然从前的事都回来了，蓬蓬的打门声……她引以自慰的一切突然都没有了，根本没有这些事，她这辈子还没经过什么事。\n“大姑娘！大姑娘！”\n在叫着她的名字。他在门外叫她。”[4]\n张爱玲惯用的首尾一致，亦如《金锁记》里“汗毛凛凛的反常的明月”，这不只是中国诗学传统里的“意象”，而是被唤起（conjured），超出了文本本身的象征秩序——成为本雅明的作为过去的“意象”——辩证意象。它是历史时间中过去与现在的瞬间交汇所形成的意象，并非传统意义上的因果关系，而是一种“时刻等待着被‘现在’唤醒的意象，它如记忆般轻灵飘忽，可是一旦与‘现在’结合起来，便能进发出摧枯拉朽的强力”[11]。“她引以自慰的一切突然都没有了”“根本没有这些事”“她这辈子还没经过什么事”[4]，在张爱玲故事的最后，总是什么都不剩下了，只剩下“意象”（辩证意象）在静静闪烁。\n从七巧的“疯女”到银娣的“怨女”，彻底的“疯”被压抑、遮蔽成了心中畸变的“怨”。幻想无声地裂开一道痕，细枝末节的延伸，每多一道分岔就是一个新的微小的反射的平面，是书写的拓扑学。张爱玲写的是，进步不是对过去的超越，而是对过去灾难的遮蔽。她以一种近乎绝望的视角展现了女性的悲剧命运，并不试图给出一个“美满结局”，而是通过对女性命运的揭示，触及到更深层次的社会与历史结构的问题。\n她想说，也许我们从未真正“现代”过。\n\n二、历史的罡风\n\n不同于现代人最为熟识的将时间分为过去、现在与未来的线性模式，本雅明通过继承尼采的“永恒回归”嫁接弥赛亚神学，对线性时间观的批判与重构，打破了传统的历史时间架构。\n本雅明通过对线性时间观及当时占主导地位的历史主义的批判，重构了过去、现在与未来之间的关系，提出以“弥赛亚时刻”的介入打破历史的因果链条。在这一时间观中，“现时”（Jetztzeit）作为时间的断裂点，承载着激活历史潜能的政治契机，从而赋予被压迫者的记忆以摧枯拉朽之力。此处出现了“历史主义”与“历史唯物主义”的二分法——“历史主义”站在胜利者/统治者的立场上，以“了解之同情”通过书写历史的进步试图一劳永逸。而“历史唯物主义者”却不放过过去的任何一个细节，他们在过去中看到一种“弥赛亚的力量”，任何“现在”都是“末日审判”[11]。\n在第九条论纲中，本雅明以其收藏的保罗·克利的《新天使》一画，描绘了他所设想的时间模型：\n保罗·克利的《新天使》画的是一个天使看上去正要从他入神地注视的事物旁离去。他凝视着前方,他的嘴微张,他的翅膀展开了。人们就是这样描绘历史天使的。他的脸朝着过去。在我们认为是一连串事件的地方,他着到的是一场单一的灾难。这场灾难堆积着尸骸,将它们抛弃在他的面前。天使想停下来唤醒死者,把破碎的世界修补完整。可是从天堂吹来了一阵风暴,它猛烈地吹击着天使的翅膀,以至他再也无法把它们收拢。这风暴无可抗拒地把天使刮向他背对着的未来,而他面前的残垣断壁却越堆越高直逼天际。这场风暴就是我们所称的进步。[7]\n在论纲中,本雅明直接使用“历史天使”作为意象，借指历史唯物主义者,将神学与历史哲学相互嵌入。张爱玲的书写指向了一种相似的非线形非目的论的历史观念，在这个角度上，将张爱玲比作“历史的天使”，再合适不过。\n本雅明描述的“历史天使”面对的是一片灾难性的废墟：过去的断裂与压迫堆积在他的面前，而未来的风暴却迫使他无法停留，只能无助地被推向更远的未知。同样，在《怨女》中，张爱玲通过女性命运的书写，展现了类似的历史观——主人公银娣的生活充满了过去的阴影和未竟的情感，家庭和社会结构的压迫不断累积，使她的命运成为一座无法逃脱的废墟。\n再回到最后的结尾银娣的记忆片段，银娣最后对时间的感受——“日子越过越快，时间压缩了，那股子劲更大，在耳边呜呜地吹过，可以觉得它过去，身上陡然一阵寒飕飕的”[4]——这书写的不正是“时间的风暴”吗？它既帮助银娣确认自己的存在感，又以其不可抗拒的力量让她感到恐惧和无助，然而“并不坏”。三爷死了，身上被浸透“一层层旧衣服与积年鸦片烟薰的气味”，回忆的时间轴逐渐拉长，直到烟灯被小丫头打落在地作为触发回忆的灵光一现，于是“想起从前拿油灯烧一个男人的手”——“从前的事都回来了”。这些记忆都是她在漫漫长夜里慰藉自己的支撑，然而一切的慰藉终究归回破裂和虚无——“根本没有这些事”[4]。\n过去在记忆中出现，却又迅速崩塌为一种幻象，银娣对历史的体验并非连续的因果链条，而是一种破碎的、断裂的存在。记忆和现实交错成一个无法整合的碎片网络，她的生活本身就是这种废墟的隐喻：鬼气森森（uncanny）的家庭、无法修复的关系、鸦片烟雾无时不刻不停的萦绕。这些记忆的碎片如同历史的残垣断壁，堆积在她的意识中，但无法被彻底修补和重建。个体无法在历史的废墟中找到完整的意义。\n也只有从这个角度才能理解张爱玲对时代的质询：“这时代，旧的东西在崩坏，新的在滋长中。但在时代的高潮来到之前，斩钉截铁的事物不过是例外”[9]。历史只能后来回溯地追认，在当时真正生活着的人却无法无法看清历史究竟孰是孰非，又向何处去。张爱玲笔下的人们“只是感觉日常的一切都有点儿不对，不对到恐怖的程度”，而她作为“历史的天使”试图以书写去记录和修复，终究只是“郑重而轻微的骚动，认真而未有明目的斗争”[9]。“历史的罡风”十万八千里的吹着，进步为名的历史的风，吹着“现代”的天使，节节向后，退到无可再退，毫无招架之力。\n\n三、另类现代性——“把我包括在外”\n\n1979年，《联合报》开辟“文化街”一刊邀请张爱玲填写近址的城乡地名与工作性质。张爱玲以一篇小文回应，以拒绝填表：\n过去好莱坞制片家山谬·高尔温是东欧移民……英语始终不纯熟……但是他最出名的几句名言……“把我包括在外（Include me out）”……联副新辟“文化街”一栏，寄了一份表格来让我填写近址的城乡地名与工作性质……但是在文化街蹓跶看橱窗有我，遇到电台记者采访舆情，把扩音机送到唇边——尼克逊总统辞职那天我就在好莱坞大道上遇见过一个——我就不免引一句“把我包括在外”了。[13]\n诚如王德威所言，与左翼作家们的壮志截然不同的是，“张爱玲一脉的写作绝少大志”[2]。由此，与鲁迅等左翼作家的“苦大仇深”相比，张显得更为轻松，轻松到足以用一种略带讽刺的幽默，借语词的错置旁逸斜出地开辟了一个自我的空间——“把我包括在外”——不在里面、外面，在不进不退之中展现想象的余地。\n于张爱玲而言，“包括在外”（include me out）不是一个“快乐”的词，不是策略性地将自己排除在既定法的范畴之外，而是无奈之举，一种“苦涩的幽默”。“包括”的问题与现代性的生存情景不无关联——产生、见证自我管理的技术性问题（technology of selfhood）。这是张爱玲一生的挑战，“包括在外”与某一种的危机意识、难民意识、逃逸意识的关联，甚至是一种现代的问题。\n笔者认为，“把我包括在外”是张爱玲所书写的“另类现代性”，这种自反的修辞颠覆了长久以来“中心-边缘”、“主流-另类”的二元对立。《怨女》中，银娣的命运并未被传统的现代性叙事所拯救。“进步”“革命”只是时代的罡风，一路只是“掩埋”碎屑的记忆，女性只是被进步“包括在外”。她既无法完全摆脱旧社会的束缚，又无法真正融入所谓的“进步”现代化进程。张爱玲通过银娣的困境，展现了个体在现代性框架中的无奈与挣扎，而这种挣扎恰恰是一种对现代性本身的另类书写。\n周蕾观察现代西方，认为现在的“高雅”现代艺术作品与某种对“原初的迷恋”（the primitive passion）不可分割——“西方现代主义的形式创新是急需将非西方世界的疆域和人民原初化的另一面”[14]。以此为镜重新审视中国电影，周蕾提出第三世界同样有一种相似的原初化运动：抓取的原始材料乃是社会上受压迫的阶级——特别是女性——构成了新文学的收养组成部分。[14]然而，周蕾却在无意中复蹈了“压迫-被压迫”二元对立。\n若将“包括在外”作为张爱玲的写作核心，我们可以观察到其笔下的女子不只是扁平的“被压迫者”，她们虽然在社会和家庭中处于被压迫的地位，但并非简单的受害者形象，而是带有主动性、复杂性甚至对男性关系的操控。在《怨女》中，银娣在情感与记忆中试图并成功主导了情境，她通过烧男人的手，短暂地感受到控制权的快感，尽管最终这一记忆被时间侵蚀为虚无；同时，张爱玲所书写的男性也往往受到阉割（castrate）。她笔下的男性形象往往无法完全掌控女性或家庭，无论是《金锁记》、《怨女》中盲的、残废的丈夫，还是《怨女》结尾中在门外呼唤却无法被回应的声音，张爱玲通过这些人物关系，打破了性别压迫的单向性，将男性和女性都置于一种被历史、文化和情感压迫的复杂交织中。这种叙事策略对左翼小说中女性的“原初化”进行了反思，也在性别结构中引入了一种去中心化的视角。\n回到本雅明，其念兹在兹的“历史的天使”旨在拯救那些被遗忘的历史碎片，在“现时”中重构过去的意义。若将张爱玲的“包括在外”视为不仅是对现代性叙事的批判，这也是对传统历史叙事的一种颠覆——不试图重建一个完整的历史，而是在断裂与矛盾中展现历史的多重面向。正如本雅明的天使想停下脚步修补废墟，张爱玲的写作也试图在“进步的罡风”中驻足，在最小的方寸之地，为那些被压迫者的声音找到表达的余地。\n在这个角度上，张爱玲刻意回避历史、社会与革命议题的写作立场，恰恰让她跳脱出了当时革命文学的局限。她以“郑重而轻微的骚动，认真而未有名目的斗争”[10]为我们思考中国现代性提供了一个全新的维度。比起为征服者的象征秩序推轮转毂，张爱玲选择揭开了想象界的面纱，这背后“她引以自慰的一切突然都没有了，根本没有这些事”[5]，只剩下令人战栗的荒凉。\n她在说：“欢迎来到实在界这片大荒漠。”[15]\n \n【参考文献】\n[1].\t子通, 亦清主编. 张爱玲评说六十年[M]. 中国华侨出版社, 2001\n[2].\t王德威. 落地的麦子不死：张爱玲与“张派”传人[M]. 山东画报出版社, 2004\n[3].\t夏志清. 中国现代小说史[M]. 刘绍铭, 李欧梵, 林耀福, 等, 译. 复旦大学出版社, 2005 \n[4].\t张爱玲. 怨女：张爱玲全集03——小说[M]. 北京十月文艺出版社, 2012 \n[5].\t司马新. 张爱玲在美国：晚年与婚姻[M]. 徐斯, 司马新, 译. 上海文艺出版社, 1996.\n[6].\t奈格里. 超越帝国. 北京大学出版社, 2016.\n[7].\t瓦尔特·本雅明,张旭东.历史哲学论纲[J].文艺理论研究,1997,(04):93-96. \n[8].\t毛姆·布罗德森. 在不确定中游走：本雅明传[M]. 国荣, 译. 金城出版社, 2013. \n[9].\t斯台凡·摩西. 历史的天使：罗森茨维格、本雅明、肖勒姆[M]. 梁展, 译. 华东师范大学出版社, 2017.\n[10].\t〔美〕周蕾. 妇女与中国现代性：西方与东方之间的阅读政治[M]. 蔡青松, 译. 上海三联书店, 2008\n[11].\t周琪. 现在的时间——论本雅明《历史哲学论纲》中的弥赛亚因素[J]. 文化与诗学, 2022(1): 239-253. \n[12].\t张爱玲. 流言：张爱玲全集06[M]. 北京十月文艺出版社, 2019.\n[13].\t张爱玲. 重访边城：张爱玲全集08[M/OL]. 北京十月文艺出版社, 2019.\n[14].\t周蕾. 原初的激情：视觉、性欲、民族志与中国当代电影[M]. 孙绍谊, 译. 遠流事业股份有限公司, 2001. \n[15].\t〔斯洛文尼亚〕斯拉沃热·齐泽克. 欢迎来到实在界这个大荒漠[M]. 季广茂, 译. 译林出版社, 2015.\n", "quqiubai": "摘要：《多余的话》作为瞿秋白的遗作，因其真伪与内容争议，在革命文学脉络中具有独特地位与多重意义。本文引入德勒兹与伽塔利的“次要文学”概念，认为瞿秋白通过“涂抹书写”和语言的“克里奥尔语化”解构主流语言的辖域，并以此实践“小民族政治”，颠覆了二元身份与两极选择。通过对照阅读瞿秋白绝笔诗《偶成》，以其中的佛教典故入手，《多余的话》中渗透出的“半偈”，揭示了文学机器对主体及其权力关系的解构，使叙事主体成为一种“装配”，进而获得未竟的“伟大的个性”。\n\n关键词：《多余的话》；次要文学；瞿秋白；德勒兹；加塔利\n\n瞿秋白有着相当混杂的多重身份。历来对于瞿秋白的研究，都偏重于他的共产党革命家身份，观察其在中国党史中扮演的角色与对马克思主义文艺理论思想的贡献。而西方汉学如夏济安先生，则偏重于其“五四文人”之身份，以为瞿秋白不慎遭际革命时代的风暴，成了“一名心软的共产主义者”(Tenderhearted Communist)[1]。\n《多余的话》作于1935年，是瞿秋白死前所留遗作。于此文中，瞿秋白忠实而细腻地回首来时路，更是直接声明了自己作为“二元人物”的脆弱与不堪，被视为自我剖析的典范。然而，若将此文放置在革命文学脉络中，《多余的话》却始终作为一个异数，一个无法被五四以降统领的左翼叙事收归的幽灵，盘旋在中国现代性上空。\n“文革”开始后，批瞿随批刘展开，以《多余的话》作为“罪证”，瞿秋白被认为是“叛徒”加上“左倾盲动主义”，遭到公开批判。1967年，瞿秋白以“叛徒”之名被砸毁坟墓，爱人杨之华亦被抄家。1980年10月19日,中共中央办公厅发出了转发中纪委《关于瞿秋白同志被捕就义情况的调查报告》的通知,结束了对此案的复查工作[2]。陈铁建《再评<多余的话>》作为重新关注瞿秋白的评论，提出代表性的观点：“《多余的话》……既有长处，也有弱点；既有令人夺目的光辉，也有使人不爽的灰暗。光辉是主要的，灰暗是次要的。”[3]\n于此，瞿秋白的自我揭露中，“政治上的不称职与厌倦、身体的先天不足，性格的软弱作为不合左翼论述规范的“靡靡之音”成为了“次要的灰暗”，永远无法掩盖左翼论述念兹在兹的“夺目光辉”。然而，笔者尝试引入德勒兹与伽塔利的“次要文学” (kleine Literatur，法文: littérature mineure，英文: minor literature)探寻新的可能。德勒兹和瓜塔里认为，次要文学有3个特点：语言的解域化、个人与政治的直接联系，以及直接书写集体价值[4]。由此，以“次要的文学”作为阅读的出发点，笔者以为瞿秋白零余、散落的书写，以“狱”中抒情的形式，脱离了诗人个人书写与左翼传统的疆“域”，生成文学本身的自主性与批判性，直至成为一种具备机器性与革命性“文学机器”[4]。\n\n一、“次要”的操演——语言的解域化\n\n德勒兹和伽塔利在《卡夫卡》中谈论书写“次要文学”的语言，并不是传统上使用人数数量稀少的“小语种”，而是将主流的语言“次要化”(minorant)的语言[4]。在《多余的话》中，我们可以发现瞿秋白尝试了多种将主流的语言/言语“次要化”的方式。\n首先，是德里达式的“涂抹书写”。德里达试图反抗弥漫在一切语言与社会结构的在场形而上学，却发现没有可能能发明一种新的、被认定是非形而上学的语言，只能采取了“涂抹书写”(Sous rature)的方式，即“在文本中划掉一个词，但允许它保持清晰和原位”[5]，认为这是借用旧的名字，用于自己的用途。\n《多余的话》至今未寻到瞿秋白手迹，版本众多，真伪之辩前人已多有论述，大多都认为文章出自瞿秋白之手。本文循《瞿秋白文集》(政治理论编)第7卷（人民文学出版社1991年10月版），以中央档案馆保存的国民政府档案手抄本为准。细察抄本，可以发现大量明显的错字、漏字。全文仅一万六千余字，却出现了二十余处错误，这对于写作向来精准、快速的瞿秋白是不常见的。然而，若将这些笔误视为刻意的文学选择，则为我们打开了文本新的解读空间。\n死灭的前夜，作为被拉出革命队伍的人，瞿秋白回首苍茫，试图书写一个“零余人”的“多余的话”，然而二元两端，左翼的革命话语与小布尔乔亚知识分子“自我分析脾气”两相夹击，瞿秋白只能“刻意”暴露出大量错误，一边书写，一边涂抹。\n另一条路径是，语言的“克里奥尔语化”（creolized）。克里奥尔（Creole）一词原意是“混合”，泛指世界上那些由葡萄牙语、英语、法语以及非洲语言混合并简化而生成的语言。于此，笔者将其误用为瞿秋白的书写刻意混用最平白、立诚的左翼语言与最晦涩、迂回的古典语言。并且，这不只是单纯的均匀混杂，而是传统文人的抒情语言对共产党员的革命语言的时时萦绕（haunting），幽灵学意义上的混杂。\n纵观全文的写作，《多余的话》受俄罗斯文学中“零余人”自我剖析方式的影响，作为瞿秋白心声的吐露，直抒胸臆，语言大体上是直白如话的。然而，细察之下，随着典故的使用，“文人”习气在瞿秋白脆弱的时刻一次又一次归来。\n回到《多余的话》开头，“知我者谓我心忧；不知我者谓我何求。”，《诗经·黍离》的典故。原典描写的是，西周灭亡后，周代贵族流离失所，回到旧京，看到荒野蔓草心生忧伤。王德威认为，这可以解释为瞿秋白的“说不尽的抱负，行将永远沉默的心志”[7]。暧昧的引言，同时也映射出瞿秋白此时的处境——徘徊于精神废墟之上的没落士大夫，无可奈何，无所归依；结尾之际，《宋史》之典又惘惘浮现——“一为文人便无足观”。于此，刘挚之言被借用为嘲讽（自嘲）一个行将消逝的残余的高等游民阶级，表达自己作为虚弱文人难担政治的重负。然而，刘忠肃所言原文“士当以器识为先，一命为文人，无足观矣”，是为了区分从政之士与秀才文人，强调作为前者的器度与见识，却被瞿秋白刻意略去了。瞿秋白吊诡地调解了典故，强调知识分子介入政治的“器识为先”的原意，却用来解释、自嘲自己无力承担政治事务的虚弱。\n典故作为文人最娴熟的工具，却是瞿秋白自己所坚决杜绝的：“一定要用口头读出来普通工人可以懂得的话来写……用真正的白话，而且是浅近的白话，每一次用到新名词一定要顺便解释”[6]。最新的革命党人的绝灭前夜，却使用了最古的典故抒之以情。然而这抒情，是酸涩的自嘲，也是隐秘的开脱。\n通过上述两种方式，瞿秋白的书写语言解开了二元的辖域，《多余的话》成为了加塔利与德勒兹所言的“不可能的文学”[4]——瞿秋白不可能不写作，因为被压抑的“多余的话”不得不说，且在“狱”中必须通过文学的通道才能流动；同时，瞿秋白不可能不使用“混杂”的语言写作，因为他既“不能够否认是‘文人’之中的一种”[6]，却又“走上了马克思主义的初步，无从改变”[6]，于是只能书写着一种解辖域化了的，并且在书写与言说的瞬间被异质化了的语言。\n\n二、非二元人物——小民族政治\n\n通过多重的操演，瞿秋白获得了解域化的语言。不纯粹的语言的写作，孕育出了次要文学的革命性。德勒兹与加塔里研究卡夫卡时指出了语言是行动的方式，做事的方法——“语言的主要功能不是沟通，而是赋予秩序，传达所谓的‘秩序的语词’”[8]。在次要文学中，主体作为解域化语言的载体——甚至更进一步——“没有主体，只有‘发声的集体装配’”[4]，使得次要文学的革命性溢出俄狄浦斯式的家庭，直接与社会政治相关。需要指明的是，此处的社会政治不是通常理解的宏大政治，卡夫卡在日记中指明了这种小民族政治（minor politics）——“一切都发生在光天化日之下，是每一个人所关注的生死问题”[9]。\n瞿秋白在“受限制的空间”中、在“不可能”的环境中书写，特别关注个体生活与各种复杂社会政治的联系，与贯穿其身的权力不断进行交锋，而个人的生活具身实践与抽象的国家命运勾连在一起，在“不可能”的罅隙间勾勒出一条“逃逸线”。这正是內格里的论断——权力渗透到了生命中，包含了构成了生命的所有事件[10]。在瞿秋白的写作中，生活就是权力的战场。\n正文叙述开场，便是瞿秋白母亲的自杀事件。母亲的自杀使“家庭离散”，于是瞿秋白只身赴往北京，展开了作为革命党人的后传。母亲的死亡似乎被刻意追溯了一个创伤的原点，从此，瞿秋白开始了一生的漂泊。然而，为何母亲的死亡成为了一生的起点，难道仅仅是因为家庭的离散？《饿乡纪程》中，瞿秋白回答了疑问——“我母亲已经为‘穷’所驱逐出宇宙之外，我父亲也只是这‘穷’的遗物 。”[11]。追溯“穷”的根源，瞿秋白将个人命运勾连了整个“衣租食税”的士绅阶级，其一家的离散，是整个士绅阶级作为“中世纪的‘残余’和‘遗产’”[6]在中国现代化过程中必然消亡的隐喻。因此，瞿秋白必须寻求变化，他试图渴求马克思主义的人生观来蜕变，寻求从“士绅”变成一个“无产阶级分子”。\n这就是小民族政治运动的场域，它通过主体多重身份的混杂展开，使预设的统一主体意识分裂为多样性共存的集合体，不同声音在其中碰撞、融合，赋予主体性新的意义。小民族政治可以通过身份的分裂展开。在《多余的话》中，我们可以从瞿秋白对统一主体的解构，看到他如何努力生成“非二元人物”身份。\n在《〈鲁迅杂感选集〉序言》中，瞿秋白用不少篇幅叙述辛亥革命前夕以来中国知识分子群体的几次重大分化，尤其是五四运动和五卅后期中国思想界的分裂——形成了“早期革命作家”（如鲁迅）和“薄海民”（小资产阶级的流浪的智识青年）[12]。与《多余的话》对照阅读，可以观察到瞿秋白似乎将自己归为了第二类——首先加入革命，但若克服不了自己的罗曼谛克主义，便会“落荒”、“颓废”。\n但在《多余的话》自我批驳中，“薄海民”只是其脆弱二元人格的一面。“脆弱的二元人物”一节，瞿秋白表述了自己拥有“二元化的人格”——一边是“马克思主义”的“无产阶级的宇宙观和人生观”，一边是“潜伏的绅士意识，中国式的士大夫意识，以及后来蜕变出来的小资产阶级或者市侩式的意识”。然而想要成为一名“无产阶级的革命先锋”，瞿秋白只能“时时刻刻压制自己的绅士和游民式的情感，极勉强的用我所学到的马克思主义的理智来创造新的情感，新的感觉方法”[6]。尽管艰难，但瞿秋白仍旧尝试摆脱自己的阶级的痼疾，这正是瞿秋白自己所理想的“个性天才”：\n当代的社会心理有阶级的分化，个性能“自由”选择某一阶级的观点,“自由”趋向于某一阶级的解决问题法……伟大的个性能超越阶级而自由选择观点，是因为这一争的过程显示了必然的因果律，使他不得不转移其观点于新阶级，结果仍旧是阶级的观点。所以个性的动机仅仅是群众动机的先锋、阶级动机的向导。[13]\n瞿秋白不只是简单地颠倒了马克思主义人生观/绅士意识、共产党员/文人、革命作家/薄海民的二元对立，而是以其自身的经历创造了一个既不在此、亦不在彼的新的混杂身份，是“二元彼此转换、矫正”的一体[14]。这样的生成避免了简单的“再辖域化”（reterritorialize），创造了符合过渡期的中国社会的智识分子角色。由于新的民族尚未完全形成，其意识尚处于萌芽状态，因此，次要文学的作者需要不断解构那些限制、控制、压迫人们的各种权力关系，以创造出潜在的、未来的人，并通过持续的生成过程避免这些人被权力再辖域化，防止他们形成僵化的民族身份，从而丧失革命的能动性。\n\n三、“半偈”何得？——解“域”作为解“狱”\n\n1935年6月18日，《大公报》记者亲历瞿秋白的最后时刻，记录下了如下文字：\n（瞿秋白）乃至中山公园，全园为之寂静，鸟雀停息呻吟，信步行至亭前，已见韭菜四碟，美酒一夔，彼独坐其上，自斟自饮，谈笑自若，神色无异。酒半乃言曰:“人之公余稍憩，为小快乐；夜间安眠，为大快乐；辞世长逝，为真快乐。”继而高唱《国际歌》，以打破沉默之空气，酒毕徐步赴刑场，前后卫士护送，空间极为严肃，经过街衢之口，见一瞎眼乞丐，彼囚回首顾视，似有所感也。既至刑场，彼自请仰卧受刑，枪声一发，瞿遂长辞矣![15]\n《大公报》作为最具影响力的报纸，以“不党、不卖、不私、不盲”的“四不主义”原则闻名，并非是为共产党宣传而刻意塑造瞿秋白的从容。罗伯特·C·诺斯（Robert C. North）参照其他的数据，描述了跟《大公报》不一样的情景[16]，但瞿秋白同样以自若镇定的神情从容就义。究其缘由，除却其得到了在《多余的话》中自言渴望“永远的‘伟大的’可爱的睡眠”，我们也可以从瞿秋白绝笔集句诗《偶成》中寻到蛛丝马迹。此诗并附有小序,参照如下:\n一九三五年六月十七日晚，萝行小径中，夕阳明灭，寒流流咽，如置身仙境，翌日读唐人诗，忽见“夕阳明灭乱山中”句，因集句得偶成一首:\n夕阳明灭乱山中，(韦应物)\n落叶寒泉听不穷；(郎士元)\n已忍伶俜十年事，(杜甫)\n心持半偈万缘空。(郎士元)[18]\n前彦时杰多对尾联多有论述。罗宁凭着对这句诗句的分析，追溯原典，证明瞿秋白从容就义与佛家思想之间的联系，认为“不能不说是佛教‘菩萨行的人生观，无常的社会观’使他无所畏惧地正视现实”[17]。张历君发展其论述，关注了瞿秋白对与郎士元原句“僧持半偈万缘空”的修改，认为“心”作为全诗诗眼，是“就菩萨行而为佛教人问化的愿心”，标志着二十世纪初中国知识分子为左翼思想所作出的理论贡献[19]。\n然而，同样以“心”作为阅读重点，亦可以回到《多余的话》的写作。“脆弱的二元人物”一节，瞿秋白描述对政治工作的疲惫和不堪，使用了相似的叙述——“一九三一年一月的共产党四中全会开除了我的政治局委员之后,我的精神状态的确是‘心中空无所有’的情形”[6]。类似的论述，然而“心”中却截然不同。书写《多余的话》时是“空无所有”，就义前心中所却多了“半偈”。这“半偈”究竟为何，可以被瞿秋白空荡荡的、疲惫不堪的心持有，并最终获得了超脱与开解。\n罗宁认为诗中的“心持半偈”指“诸行无常，是生灭法；生灭灭已，寂灭为乐”偈中的后二句，典出《涅槃经》卷十四——讲述了雪山童子为求罗刹“半偈”而舍身的故事[17]。故事里的雪山童子（释迦过去世），为了得闻化身罗刹的帝释天所宣说的后半佛偈，而愿舍弃生命，这后半偈指的是“生灭灭已，寂灭为乐”两句[20]。“寂灭”作为“圆寂”的旧译法，意为僧人逝世，以逝世为乐，证得了解脱的最高境界。这与瞿秋白就义前饮酒长啸之句不谋而合——“辞世长逝，为真快乐”。因此，罗宁认为瞿秋白书写之际必然回想起了佛教“菩萨行的人生观，无常的社会观”[17]。\n然而，罗宁、张历君等人却没有论述此“半偈”从何处取得，似乎将其视为瞿秋白就义前的“偶得”。笔者却以为，正是通过书写《多余的话》，瞿秋白与释迦进行了相似的操演——“投身树下”，献出不堪的肉身，为取得神圣的“半偈”。\n回到《多余的话》结尾，瞿秋白的“告别”，开篇便是一句感叹“一出滑稽戏就此闭幕了！”。告别的时刻，瞿秋白为自己在“文学”和“政治”间的摆荡彻底做结，认为自己是文人充当“政治领袖”，是在革命政治舞台上戴着假面表演的丑角。书写《多余的话》则是他第一次(也是最后一次)自我揭露的表演，是瞿秋白自言的极大痛快：\n我早已说过：揭穿假面具是最痛快的事情，不但对于动手去揭穿别人的痛快，就是对于被揭穿的也很痛快，尤其是自己能够揭穿。现在我丢掉了最后一层假面具。你们应当祝贺我。我去休息了，永久去休息了，你们更应当祝贺我。\n落幕前的表演，瞿秋白身处于牢狱之间，已经被拉出了革命队伍。如果将瞿秋白告白的对象——战友、朋友、爱人视为舞台上“称职的演员”，那么这是一出“主角”已经退出舞台的丑剧。换句话说，在这个空洞的喜剧舞台上，丑角成了唯一的存在。他独自承担起那份令人尴尬却又不可避免的表演，这种表演带有一种深刻的自觉：他不仅在展示自己，也在直面自己存在的终结。如果将舞台上的演员脱下表演的面具视为一种死亡，那么瞿秋白通过自我揭露，已经让舞台上的丑角“替”他死了一次。正是这与释迦相似的结局，让他可从饥渴的罗刹处取得“半偈”，\n如果将《多余的话》视为一部主体的自述史，我们可以发现随着瞿秋白的叙述，主体从一个预设的统一体分裂为对立的二元，而又从摆荡的二元中生成了混杂的解域身份，最后，主体以丑角的形式登场，在自我的揭露中迈向了死亡。主体的死亡，并不意味着叙事主体的不存在。德勒兹和加塔利研究卡夫卡的文学，认为卡夫卡《审判》中的K不再是单纯的角色，而是一种“集体性装配”[4]。追究K是谁终究是徒劳的，主体“解散”之后，是“集体表述装配”通过具体的个案生产集体的认同。\n当叙事主体成为了一种“装配”，那么某种意义上，次要文学成为了一种“文学机器”，它的动力源自“集体表述所赋予的内在力量”[22]。这“文学机器”具有丰厚的生产力，它不是封闭的系统，而是开放的差异网络，通过互动和联结生成新的意义和观念。瞿秋白通过《多余的话》，使用解域化的语言创造（发明）了混杂的主体身份，而又通过书写使叙事主体“死亡”——“替”瞿秋白取得了“半偈”。“文学机器”的生成并不为了任何一种意识形态，不是对固定系统的顺从，而是从其个案，表述出群体的观念与价值。文学机器解构了主体，文学没有叙事主体，只有表述的集体装配，它是未来的、尚未形成的“新的阶级”，于瞿秋白而言，便是其念兹在兹的“伟大的个性”。\n瞿秋白的刑场之中，我们似乎可以听见文学机器生产的轰鸣之声。这丰沛的生产解开了限制、控制、压迫人们的诸种权力关系形成的辖域——如果将牢狱监禁也视为权力的一种——甚至解开了长汀县罗汉岭的汀州监狱。因此，瞿秋白得以在《多余的话》的结尾闲笔荡开，对俄国文学、中国文学、中国豆腐这些看似“次要的东西”一一告别；得以在前往刑场的街衢之口，被瞎眼乞丐这样“次要的人”似有所感地回首顾视。在这些零余的、次要的事物里，我们仿佛看见瞿秋白在生命的断井颓垣中生产。二元的身份、两极的选择间，幻想无声地裂开一道痕，细枝末节的延伸，每多一道分岔就是一个新的微小的反射的平面，异质的拓扑空间，书写的逃逸线。\n【参考文献】\n[1].\tLee, L. O., & Hsia, T. (1969). The Gate of Darkness: Studies on the leftist literary movement in China. Harvard Journal of Asiatic Studies, 29, 309. \n[2].\t中共中央文献研究室编：《中国共产党第12 次全国代表大会文件汇编》，北京:人民出版社，1982 年，第136页。\n[3].\t陈铁健.(1979).重评《多余的话》.历史研究(03),25-35.\n[4].\t吉尔·德勒兹, 费利克斯·加塔利；张祖建, 译. 什么是哲学：卡夫卡——为弱势文学而作[M]. 湖南文艺出版社, 2007\n[5].\t（法）雅克·德里达（Jacques Derrida）著；汪堂家译. 论文字学[M]. 上海：上海译文出版社, 2005.05.\n[6].\t瞿秋白著. 瞿秋白文集 政治理论编 7[M]. 北京：人民出版社, 2013.09.\n[7].\t（美）王德威著. 抒情传统与中国现代性[M]. 北京：生活·读书·新知三联书店, 2018.01.\n[8].\t（法）吉尔·德勒兹, 费利克斯·加塔利. 资本主义与精神分裂（卷２）：千高原（修订译本）[M]. 姜宇辉, 译. 上海人民出版社, 2023\n[9].\t（奥）弗兰兹·卡夫卡 著, 叶廷芳 主编. 卡夫卡全集[M]. 洪天富 等, 译。中央编译出版社， 1996\n[10].\t（意）安东尼奥·内格里著. 超越帝国[M]. 北京大学出版社, 2016.\n[11].\t瞿秋白著. 瞿秋白文集 第1卷 文学编[M]. 北京：人民文学出版社, 1985.\n[12].\t瞿秋白著. 瞿秋白文集 第3卷 文学编[M]. 北京：人民文学出版社, 1989.\n[13].\t瞿秋白著. 瞿秋白文集 政治理论编 3[M]. 北京：人民出版社, 2013.09.\n[14].\t贺桂梅.丁玲主体辩证法的生成：以瞿秋白、王剑虹书写为线索［J］.中国现代文学研究丛刊，2018，\n[15].\t王芸生. 瞿秋白毕命记 (四). 大公报. 天津大公报. 1937-07-05.\n[16].\tMoscow and Chinese Communists. (1953). Stanford University Press, 165.\n[17].\t罗宁. 瞿秋白与佛学[J]. 法音, 1988, (7):36-37.\n[18].\t瞿秋白. 多余的话: 瞿秋白狱中反思录[M]. 周楠本, 编. 台北: 独立作家, 2015.\n[19].\t张历君. 瞿秋白与跨文化现代性[M]. 香港: 香港中文大学出版社, 2020.\n[20].\t孙昌武编注. 汉译佛典翻译文学选[M]. 南开大学出版社, 2005.\n[21].\t穆潇然.如何重新激活文学？——论德勒兹和伽塔利的“次要文学”概念[J].福建论坛(人文社会科学版),2024,(02):149-160.\n[22].\t吴娱玉.主体消散与欲望生产——从卡夫卡探析德勒兹、伽塔利的文学观[J].福建论坛(人文社会科学版),2022,(09):95-108.\n", "zhutianwen": "摘要：朱天文小说《世纪末的华丽》作为其都市写作的高峰，自发表以来常被批评为“空壳”、“虚华”之作，主人公米亚亦被视为内容空洞的时尚符号。尝试在此既定批评路径外，以安娜·安林·成（Anne Anlin Cheng）提出的“装饰主义”（Ornamentalism）理论，重新理解米亚作为一种以风格为本体、以装饰为存在基础的主体。通过对米亚服饰风格与感官经验的细读，可以发现其身体并非自然统一的本真存在，而是由颜色、气味、服装与感官生成的“合成体”，一种非人性的幽灵般存在。小说中对“轻质化建筑”的书写，亦呼应了米亚幽灵般的都市主体性。置于全球资本与台湾文化变迁背景下，并结合本雅明与詹姆逊理论，认为米亚超越现代国家主体象征，她以装饰与感官细节缝补历史裂隙，构成对现代性、民族话语及历史书写方式的深刻质询，是一种游离于“正典”叙事之外的异质寓言。\n\n关键词：朱天文，装饰主义，《世纪末的华丽》，民族寓言\n\n正是从这个位置出发，个体才有可能运用自身的资源，将那些带有凶残的部分客体拼合或“修复”成某种整体。\n——伊芙·赛菊寇（Eve Kosofsky Sedgwick）\n\n东方主义是一种批判，装饰主义是一种存在论。\n——安娜·安林·成（Anne Anlin Cheng）\n\n引言\n\n朱天文小说集《世纪末的华丽》于1990年在台湾面世，作为其个人创作的里程碑，是《炎夏之都》以来都市书写的登峰造极之作。同名短篇小说《世纪末的华丽》自发表以来，引发了广泛的学术与文化关注。\n观其批评史，评论者往往以“空壳”“衰老”“形式的虚华”来定义主人公米亚的存在。詹宏志在小说集代序中指出，这篇小说尽管未正面描写身体，却在其大量服饰与饰物描写中，“逐步揭示出一个行尸走肉的身体”[1]。王德威更进一步地指出，小说自身亦可被看作是这种“空壳”的延伸，该作“对服装与形式的极致讲究，淘空了所谓的内容，而没有内容的空虚，正是《世纪末的华丽》最终要敷衍的内容”[2]。\n这一批评路径呈现出一种典型的“偏执式阅读”（paranoid reading）姿态——如伊芙·赛菊寇（Eve Kosofsky Sedgwick）所言，它是一种负面情感导向的强理论（strong theory of negative affect），揭示表象下压抑、缺失或暴力的真相，试图通过暴露系统性压迫来避免“坏消息”（anticipatory）[3]。然而，赛菊寇也同时提出了另一种阅读可能——“修复式阅读”（reparative reading），其重点不在于揭露真相，而寻找在压抑与形变中尚可构筑意义与存在的空间，“这是有可能反过来利用自己的资源将凶残的部分客体组装或‘修复’（repair）成某种整体”[3]。换言之，当偏执式阅读致力于从文本之“饰”中发掘其“里”，修复式阅读则试图正视并理解“饰”本身的感知价值与存有方式。通过结合二者，我们可以想象一种兼具关怀和批判的阅读法。\n本文正是试图借助安娜·安林·成（Anne Anlin Cheng）在《装饰主义：为黄色女人而设的女性主义理论》（Ornamentalism: A Feminist Theory for the Yellow Woman）中提出的“装饰主义”（ornamentalism）理论，回应上述阅读路径的局限。安林·成指出，不同于启蒙运动以来建构的有机的（organic）、个人主义的（individualistic）、男性的（masculine）和白人特质的（white）西方现代人格，“装饰主义的人格”（ornamental personhood）的政治意义超越了通常在种族、社会正义以及“人类优先”等讨论中所依赖的二分法——如主体/客体、内在性/外在性、能动性/压迫等。关注装饰主义就是要问，身份如何不通过有机的肉体构成，而是通过合成的发明与设计，不通过具象的身体体现（corporeal embodiment），而是通过那些具有转喻性质（metonymic）、因此是表面的（superficial）、可拆卸的（detachable）、迁移的（migratory）依附关系来构建[4]。\n诚如安林·成所言：“东方主义是一种批评，而装饰主义是一种存在论”(Orientalism is a critique, Ornamentalism is a theory of being)[5]。如果将米亚作为一种装饰性存在：她不是一个缺失内容的空壳，而是一个以风格为肉身，以物性构建存在的现代幽灵。在这个意义上，“装饰主义”并非对内容之“空”进行批判，而是作为一种存在论，对形式之中的非人性、物性、性别化与种族化暴力的修复性辨识——它不是逃避内容的阅读，而是承认装饰即内容，风格即本体。\n因此，我们也许可以提出一个反思性的问题：如果将《华丽》放入台湾文学的历史与文化背景中，米亚作为“世纪末的华丽”所展现的空虚与装饰性，是否能被视为对全球资本主义语境下台湾主体性变迁的反映？她的“装饰性存在”是否揭示了台湾在全球化过程中经历的身份分裂与文化转型？在这一过程中，米亚既是个体化的形象，也是社会性别、种族与消费文化交织的产物，展现了“装饰主义”理论在台湾文学中的深层政治与文化含义。\n本文将以“装饰主义”理论为核心方法，在文本细读基础上探讨米亚的装饰性存在如何生成一种新的、幽灵般的台湾主体形式。\n \n一、风格即本体：一个装饰主义主体的生成\n\n“米亚是一位相信嗅觉，依赖嗅觉记忆活着的人”“同样依赖颜色记忆活着”[6]——米亚登场之时的陈述，既是个人经验的宣言，也是一种阅读方法论的提示：在《华丽》中，身体与记忆、身体与时间，并非借助理性、语言建构，而是通过感官媒介——尤其是嗅觉、触觉与视觉——得以编织、牵引与寄存。可拆卸、可迁移、具借代性质的服装作为这些感官经验的核心媒介，不再是装饰性的附加物，而成为身份构成与历史记忆的本体。\n对感官的强调，正是对理性主导的现代秩序的一种潜在反抗，世纪末奢靡浪潮中，压抑的感官复活。在所有装饰性元素中，最富变奏性者莫过于米亚的服饰。朱天文以奢侈浪费的文笔，为米亚的穿着历程编年，书写出台湾青年服饰的流变：1986年，“玛丹娜亵衣外穿风吹草偃刮到欧洲，她也有几件小可爱”[7]；1987年“黄、紫、青，三色系立刻成为色彩主流”[7]，“川久保玲倒戈投入女性化阵营”[8]，“堕落天使加利亚诺回归清纯”[8]；1989年“豹纹帽”、“动物花纹外套”[9]、“鱼鳍和贝壳纹路”[10]；1990年“北极海海滨印花”[10]、“人造皮毛成为冬季新宠”[9]；1992年“帝政遗风仍兴……斗篷与长靴”[11]。这些服装风格的轮番登场，并非单纯的流行编年史，而与米亚自身“速朽”的生命历程、其流动的恋人们（老段、小凯、杨格、安、乔伊、婉玉、宝贝、克里斯汀、小葛）以及时代事件（汉城奥运、查尔斯王子婚礼、吴淑珍代夫出征）交织共振，时尚不是米亚的背景板，而是她的存在条件、记忆载体与感官器官。\n《华丽》通篇几乎没有一个字正面书写身体。相反，它花费大量篇幅描写服装、饰物、面料、香味与配色，仿佛有意回避身体的自然性，将它挤出叙述的中心。唯一一处涉及身体的文字，来自米亚对童年的一段记忆：\n那年头，米亚目睹过衣服穿在柳树粗桠跟墙头间的竹竿上晒。还不知道用柔软精的那年头，衣服透透晒整天，坚质粝挺，着衣时布是布，肉是肉，爽然提醒她有一条清洁的身体存在。妈妈把一家人的衣服整齐叠好收藏，女人衣物绝对不能放在男人的上面，一如坚持男人衣物晒在女人的前面。她公开反抗禁忌，幼小心智很想试测会不会有天灾降临。柳树砍掉之后，土地征收去建国宅，姐姐们嫁人，妈妈衰老了，这一切成为善良回忆，一股白兰洗衣粉洗过晒饱了七月大太阳的味道。[12]\n回忆中，身体不是先验存在的自然事实，而是在衣物的质地、触感与温度中被“爽然提醒”的感知对象。服装的“粗粝感”与嗅觉中的“日晒味”成了身体觉知的前提，不再是遮蔽或装饰身体的附属品，而成为构成身体意识的感官机制。进一步地，米亚所忆起的并非一个赤裸或本真的身体，而是一个被规训的身体：母亲严格规定女性衣物不得放于男性之上，衣物的排序投射了家庭性别秩序。然而，朱天文并未在此处展开直接批判，反而以“这一切成为善良回忆”与“白兰洗衣粉洗过晒饱了七月大太阳的味道”将其轻轻收束，使身体消散在布料、气味与阳光所织构的感官复调之中。\n米亚的身体从未以自然或有机的整体出现，而是一种被感官经验持续拼贴出的表面结构。她的身体是由质地、配色、气味、记忆等元素组合而成的“合成品”，是一种装饰性的存在。正如安林·成指出，黄种女性从未被现代性纳入“自然的、有机的、能动的主体”之列，她们的存在自始即是“边缘的”“被物化的”“近人性的”。但正因为如此，她们也提示了一种替代性的存在可能：以“装饰”为存在论基础的主体模式。在《世纪末的华丽》中，这种几乎完全由服饰、空间与嗅觉所建构的身体经验，不是身体的隐退，而是对“身体必须自然、统一、真实”的观念的根本颠覆。它迫使我们重新思考“成为人”意味着什么？——尤其是对那些从未被完整视为“人”的边缘个体而言：她们既非纯粹的客体，也非传统主体，而是一种在装饰物、表面之物之间延宕生成的，以风格为肉身，以物性构建存在的现代幽灵。\n \n二、轻质化建筑：风格作为空间与主体\n\n值得注意的是，故事没有直接进入米亚光怪陆离的原欲世界，而是自台湾布满违建铁皮屋顶的独特城市天际线发首：“违建铁皮屋布满楼顶，千万家篷架像森林之海延伸到日出日落处。我们需要轻质化建筑，米亚的情人老段说。”由此，朱天文对“风格”的引入是通过阐述贝聿铭的建筑理念这一看似异质的路径完成的：\n铁皮蓬架，显出台湾与地争空间的事实，的确，也看到前人为解决平顶燠晒防雨所发明内外交流的半户外空间。前人以他们生活经验累积给了我们应付台湾气候环境的建筑方式，轻质化。不同于欧美也不同于日本，是形式上的轻质，也是空间上轻质，视觉上轻质，为烈日下拥塞的台湾都市寻找纾解空间。贝聿铭说，风格产生由解决问题而来。如果他没有一批技术人员帮他解决问题，罗浮宫金字塔上的玻璃不会那样闪闪发亮而透明，老段说。[10]\n这不仅是建筑风格对现实的呼应，也通向贝聿铭式的建筑哲学——“风格产生由解决问题而来”。我们可以回到贝聿铭和他的卢浮宫金字塔，试图阐明朱天文“闲笔”背后丰厚的阐释空间。\n按贝聿铭的说法，卢浮宫需要一颗“心脏”，而且“这颗心脏需要光”[13]。只有极度透明的玻璃才能赋予一个庞大的地下建筑足够的采光，将原本分散的两翼楼体整合为一个高密度的整体，并赋予其长期缺失的接待功能、技术管理与学术研究空间——如果这一结构性短板持续存在，卢浮宫终将退化为1908年之前那种阴沉、封闭的“陵墓”。因此，贝聿铭不惜为挟总统之势令圣戈班公司重新启用了一个古老的作坊，并采用了一种古老的制造手法，改变玻璃的色彩，去掉一切铁含量，从而获得了一种理想的透明度。正因此，贝聿铭方才通过了由保管员出身的专家和他们所代表的保守意见所组成的历史古迹最高委员会(Commission Supérieuredes Monuments Historiques)会议。闪亮、透明的风格并非一种浮于表面的装饰性语言，而是一种在权力、技术与记忆之间反复协商后勉力维持的风格秩序。贝聿铭的透明，是制度缝隙中对形式的谨慎承诺。他在历史、体制与结构之间，创造出一种折中的明晰，使形式不至屈从于任何一方的压力，而仍保有尊严的张力。\n正如玻璃金字塔的透明风格不是任意选取的美学符号，而是多方制衡下的结构策略，《华丽》中“轻质化建筑”的风格同样是在一套权力、经济、历史冲击下的能动回应。自1960年代起，随着台湾经济的再次工业化与都市化，大量乡村人口移入城市。台北市位于盆地地形，腹地有限，又作为政治与经济重镇，长期吸引大量外县市人口迁入，导致市区高度拥挤。为了扩展生活空间，不少居民在建筑物屋顶平台加盖违章建筑以供居住。同时，由于多数建筑屋龄超过二十年，加上早年防水工程不完善，又位处日晒强烈、雨量充沛、地震频繁的亚热带板块带，屋顶常出现渗漏问题，居民因此在屋顶上搭建无墙体的棚架式违建，用作防漏水、隔热的简便结构[14]。时至朱天文所书写的二十世纪末，在既有的空间中追求个人领域极大化，已是台湾生活的惯习日常，也因此在土地有限的城市中，屋主常采用自建筑物本体向外延伸的增建，以贴合原有建筑的形式与样态融入地景。\n风格的生成始终与“问题解决”紧密相关——它是一种生存策略，也是一种形式上的权宜之计。在《华丽》中，“轻质化建筑”不仅是一种空间设计理念，更是一种身体对城市气候、历史地层与技术条件的具体回应——“不同于欧美也不同于日本，是形式上的轻质，也是空间上轻质，视觉上轻质，为烈日下拥塞的台湾都市寻找纾解”[10]，甚至最后成为了米亚颠覆男性世界的基础。\n相较老段订的“Dike族与单身贵族的住宅案”[15]，米亚更喜欢“自己这间顶楼有铁皮篷阳台的屋子”[15]，因为她可以晒花晒草叶水果皮，更成了米亚制纸手艺的劳动场所。行至文末，“埃及蓝湖泊”的天色里，香草花朵制成的纸张悄然成型。米亚站在铁皮篷阳台上看见城市与天象崩塌，写下了大胆的宣言：“年老色衰，米亚有好手艺足以养活。湖泊幽邃无底洞之蓝告诉她，有一天男人用理论与制度建立起的世界会倒塌，她将以嗅觉和颜色的记忆存活，从这里并予之重建。”[16]选择从感官出发，在“年老色衰”的肉身与装饰性的劳动中，静静地等待并准备“重建”之时。这种风格实践既是逃逸也是预演，是装饰性的，是女性在世纪末废墟上建立起的堡垒与寓言。\n \n三、寓言与废墟：米亚作为民族寓言\n\n回到《华丽》的写作动机，朱天文曾自述“是为了一句话而写：‘有一天男人用理论与制度建立起的世界会倒塌，她将以嗅觉和颜色的记忆存活，从这里并予之重建’”。于此，朱天文使用二元性别作为书写的法门，试图赋予女性以能动性，却内在地铭刻了一种缺憾——女性在理论与制度层面的软弱——她生活在自己的世界里，觉得符号政治属于男人的世界。然而，笔者以为朱天文的野心不仅于此。金进认为此语只是其与舞鹤的戏言（“我却认为她又犯了‘胡说’的老毛病”）[19]，理论上更为自觉的一文《废墟里的新天使》交代了真实的写作动机：\n拙作《世纪末的华丽》，借的是上个世纪末奥地利的画家克林姆(Klimt)的画。当时的首善之都维也纳是什么光景呢？我认为，米兰·昆德拉在他的小说《不朽》(Immortality)里做了最好的描述。他说:“羞耻心和恬不知耻在势均力敌的地方相交，这时色情处在异常紧张的时刻，维也纳在世纪的转换期经历了这一刻。这一刻一去不再复返。鲁本斯属于这个养成羞耻心的环境中长大的最后一代欧洲人……”[18]\n前文中，朱天文借本雅明的第一部重要著作《德国悲剧的起源》(The Origin of German Tragic Drama)为其写作的故事世界预设和建构了一种阅读方式。她认为，本雅明“借十七世纪讲二十世纪”，通过独特的寓言式批评认为“这个世界并非一个理所当然的既定世界，它展示出来的，毋宁是一个寓言(allegory)”[18]。\n本雅明独特的寓言式批评是一种未被定义的表达方式。陈晓东认为张旭东对“寓言”的解读为我们“摆脱旧有的理论规范，打开了想象的界域”[20]:“寓言是我们自己在这个时代所拥有的特权，它意味着在这个世界上把握自身的体验并将它成形，意味着把握广阔的真实图景，并持续不断地猜解存在的意义之谜，最终在一个虚构的结构里重建人的自我形象，恢复异质的、被隔绝的事物之间的联系。”[21]这无疑是对朱天文写作的精准注脚——她所塑造的米亚并非传统意义上自主、理性的现代主体，而是通过风格、嗅觉、感官经验重建其“自我形象”的装饰主义主体。米亚以气味、触觉与视觉悄然连接起“异质的、被隔绝的事物”，以“香水”、“服装”、“颜色”缝合一个即将崩坏的时代，构建一个得以存续的女性世界。\n从这个意义上说，朱天文小说中的“装饰主义主体”可以理解为詹姆逊“第三世界民族寓言”的一种变体：“第三世界文本，甚至那些表面上是个人的而且严格说来带有力比多动力(Libidinal dynamic)的文本，它们必然以民族寓言的形式具体化为一个政治维度(political dimension)”[22]。但米亚并不是“第三世界民族寓言”中“代言民族”的现代主体，她更接近安林·成所谓的“装饰性人格”（ornamental personhood）——一种由装饰品与其所依附的身体之间忧郁关系所建构出来的一种类人性（perihumanity）。台湾作为暧昧的，同时被现代性召唤又被历史遗弃的空间，根植于各种力量的冲突与协商之间——“传统与现代、中国文化主义、日本殖民主义和帝国主义，以及日本的和中国的现代化过程”[22]。因此，相较詹姆逊“对于总体性的（认知）测绘的一个形式”[24]式的寓言，米亚所指涉的，只能是本雅明意义上的寓言——一种衰败的、破碎的历史。\n朱天文避谈政治，但政治未曾远离。绫罗绸缎间，“街上吴淑珍代夫出征竞选‘立法委员’的宣传车”、“苏联红星表”、“火树银花驰过高架路，绕经东门府前大道中正纪念堂”等细节，小说的布景在不动声色中滑入历史与政治的现场。然而朱天文仅仅选择停留在漂浮的符号景观中，并不更进一步——一种压抑的政治潜意识呼之欲出——它不以议程、口号、或国家姿态出现，而以一种历史废墟中的闪回残迹存在。这正是朱天文的独特姿态：拒绝直接进入解严“后威权”时期以民进党为首的台湾社会争先恐后建构的“台湾主体性”神话。在《华丽》的文本中，正如米亚想象中的“国际都市邦联”——“这才是她的乡土。台北米兰巴黎伦敦东京纽约结成的城市邦联，她生活之中，习其礼俗，游其艺技，润其风华，成其大器”[25]——只有我们超越了殖民主义和民族主义的话语限制，才能对《华丽》以及整体的台湾文学做出批判性反思\n正如王晓珏所言，二十世纪的最后十年，随着解严后国民党的威权统治日益失效，“崛起的竞争党派民进党急不可耐地宣称一种自主的台湾意识，它对任何模棱两可的东西都感到焦虑”[26]，台湾社会在民进党的推动下，“台湾之子”的民族建构谱系建构甚嚣尘上。在这一过程中，历史的复杂性被压缩为可继承的正典，王德威极富洞见：\n它既是先验的，也是后设的。为此，不论是“汉族的遗民”（赖和）还是“亚细亚的孤儿”（吴浊流）、不论是“志愿兵”（周金波）还是“送报夫”（杨逵），全都可以列入开国史话的阵容。这些作家路线有别，却被认作殊途同归。漂荡在国朝尚未生成、却似乎曾经失去的“史前史”中，他们有若身不由己，隐忍待发——他们是未来，而非过去。[27]\n这种政治文化工程正是本雅明意义上的“征服者历史”的当代表征，它忽略了一切历史特殊性，不容许模棱两可，不容许装饰，不容许颓靡。米亚却荡开一笔，成为了强制书写中的异质物体——她勾勒出一种另类的历史书写方式：“一种通过织物、装饰与从未拥有有机整体幻象的‘肌肤’所建构的历史；一种由作为装饰性附属物而存续的非主体所构成的历史”[17]。米亚强迫人们注意安林·成所言的“细节之完整、精密、苛刻、纺织品与材料所构成的感官场域、生气勃勃的无生命物与合成快感所带来的诱人动感”，正是这场令人眩晕的视觉与感官盛宴之中，“人”与“物”之间产生了滑移，形成了一种情色而紊乱的跃进，它既是华人／亚裔女性气质（Chinese/Asiatic femininity）被建构的前提条件，也使面对这类种族化物象时，“任何基于主体与物、压迫与反抗的二元批评方式都显得捉襟见肘、无法穿透其复杂的欲望机制”[28]。从这种意义上我们才能理解米亚既不归属于现代国家建构的历史谱系，也不是可再现的“台湾之子”。她是被结构性观看的身体，她的存在不通过具象的身体体现，而是通过那些具有转喻性质、因此是表面的、可拆卸的、迁移的依附关系来构建。她没有对抗、没有言说权、没有能动性，但她以气味、图案、颜色，在世纪末的废墟上生活下去。\n\n结语\n\n本文聚焦于朱天文小说《世纪末的华丽》及其主人公米亚，旨在运用安娜·安林·程的“装饰主义”理论突破传统批评视为“空壳”或“虚华”符号的局限，将米亚阐释为一种以风格为本体、以装饰为存在论基础的独特主体。\n首先，就米亚的感官经验、身体装饰以及其作为不完全“民族寓言”而言，米亚的“华丽”并非空洞，其“装饰性”不仅是一种具有本体论意义的存在方式，更是在特定历史文化条件下形成的生存策略与美学抵抗。她的身体是有机感官与无机服饰的“合成体”，其对“轻质化建筑”的认同呼应了其幽灵般的都市生存状态，而其整体存在则构成了对现代性宏大叙事和“正典”历史的“异质寓言”。\n其次，从“装饰主义”理论角度进入米亚这一文学形象，提供了富有启发性的结合“偏执性阅读”和“修复式阅读”的解读方式，赋予了其“装饰性”以积极的意义和深刻的内涵。这不仅重估了米亚在“表面”和“细节”中所展现的能动性，也彰显了“装饰主义”理论在理解东亚女性主体、身体政治及现代性经验方面的理论贡献。\n最后，朱天文笔下的米亚，以其装饰化的感官书写和非主体性的存在方式，成功撕裂了民族寓言与现代主体建构的单一叙事。她既不是“台湾之子”的继承者，也不是抗争话语中的能动主体，而是一种寓言性的“装饰性主体”，在世纪末的废墟中，以气味、颜色与织物构建起独属自身的抒情乌托邦。正是在这场拒绝总体化、强调感官细节与存在裂痕的写作中，朱天文以“装饰主义”的抒情策略，为台湾文学提供了一种在后现代与后殖民语境中重新理解女性、身体与历史的可能路径。\n \n参考文献\n[1].\t朱天文. 世纪末的华丽：小说集1988-1990[M]. 上海译文出版社, 2010: iii. \n[2].\t王德威. 当代小说二十家〔增订本〕[M]. 生活.读书.新知三联书店, 2007. \n[3].\tSedgwick E K. Touching Feeling: Affect, Pedagogy, Performativity[M]. Duke University Press Books, 2003: 128. \n[4].\tCheng A A. Ornamentalism[M]. New York: Oxford University Press, 2019: 19.\n[5].\t同上: 18.\n[6].\t朱天文. 世纪末的华丽：小说集1988-1990[M]. 上海译文出版社, 2010: 117. \n[7].\t同上: 121\n[8].\t同上: 120\n[9].\t同上: 127\n[10].\t同上: 118\n[11].\t同上: 126\n[12].\t同上: 119 \n[13].\t李菁, 贾冬婷. 百年贝聿铭：东方与西方，权力和荣耀[M]. 生活•读书•新知三联书店 生活书店出版有限公司, 201: 156.\n[14].\t黃建中. 臺北市頂樓違章建築處理探討及改善對策之研究－以市民觀點論述[D]. 國立中央大學, 2008.\n[15].\t朱天文. 世纪末的华丽：小说集1988-1990[M]. 上海译文出版社, 2010: 132. \n[16].\t同上: 133.\n[17].\tCheng A A. Ornamentalism: A Feminist Theory for the Yellow Woman[J]. Critical Inquiry, 2018, 44(3): 415-446.\n[18].\t朱天文. 有所思，乃在大海南[M]. 上海译文出版社, 2011: 226\n[19].\t金进. 朱天文的文学创作精神流变——以《世纪末的华丽》、《荒人手记》和《巫言》为中心[J]. 当代作家评论, 2013(2): 93-101. \n[20].\t陈晓明．在理论的寓言里独辟蹊径——试论张旭东的理论批评[J]．中国文学批评，2022（1）：117 \n[21].\t张旭东. 幻想的秩序：批评理论与当代中国文学文化[M]. 上海人民出版社, 2020: 84. \n[22].\t弗雷德里克·詹姆逊,孙盛涛,徐良.鲁迅:一个中国文化的民族寓言——第三世界文本新解[J].鲁迅研究月刊,1993,(04):43-48. \n[23].\t张旭东.寓言批评——本雅明“辩证”批评理论的主题与形式[J].文学评论,1988,(04):149       if (other.length) navItems.push(`<a href="#cat-other">其他</a>`);

      const sections = [];
      for (const c of cats) {
        const items = buckets.get(c.id);
        if (items.length) sections.push(renderSection(c.id, c.label, items));
      }
      if (other.length) sections.push(renderSection('other', '其他', other));

      $list.innerHTML = `
        <div class="list-wrap">
          <header>
            <h1>${escapeHtml(MANIFEST.site.title)}</h1>
            <p class="lede">${escapeHtml(MANIFEST.site.subtitle || '')}</p>
            <nav class="nav">${navItems.join('')}</nav>
          </header>
          <main>${sections.join('') || '<div class="empty">尚无作品。</div>'}</main>
          <footer class="colophon">WeiChow</footer>
        </div>`;
    }

    function renderSection(id, label, items) {
      return `
        <section class="cat" id="cat-${id}">
          <h2 class="cat-label">${escapeHtml(label)}</h2>
          <ul class="works">
            ${items.map(w => `
              <li>
                <a class="work" href="#/read/${encodeURIComponent(w.id)}">
                  <div>
                    <h3 class="title">${escapeHtml(w.title)}</h3>
                    <p class="desc">${escapeHtml(w.subtitle || '')}</p>
                  </div>
                  <span class="arrow">→</span>
                </a>
              </li>`).join('')}
          </ul>
        </section>`;
    }

    function showRead(id) {
      const work = MANIFEST.works.find(w => w.id === id);
      if (!work) { location.hash = ''; return; }
      const themeKey = ['creative', 'news', 'criticism'].includes(work.category) ? work.category : 'creative';
      document.body.className = 'theme-' + themeKey;
      document.title = work.title;
      $list.hidden = true;
      $read.hidden = false;
      $topbarTitle.textContent = work.title;
      const cat = (MANIFEST.categories || []).find(c => c.id === work.category);
      $catLabel.textContent = cat ? cat.label : '';

      const by = BYLINE[themeKey];
      const bylineHTML = `<p class="byline">${escapeHtml((by.prefix || '') + '周未' + (by.suffix || ''))}</p>`;
      $masthead.innerHTML = `
        <h1 class="headline">${escapeHtml(work.title)}</h1>
        ${work.subtitle ? `<p class="lede">${escapeHtml(work.subtitle)}</p>` : ''}
        ${bylineHTML}
        <div class="rule"></div>
      `;

      const v = VERT[themeKey];
      if (v) {
        $vert.innerHTML = `<span class="en">${escapeHtml(v.en)}</span>　${escapeHtml(v.cn)}`;
        $vert.style.display = '';
      } else {
        $vert.style.display = 'none';
      }

      const text = WORKS[id] || '';
      const paragraphs = text
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .split(/\n+/)
        .map(p => p.trim().replace(/^[　\s]+/, ''))
        .filter(p => p.length > 0)
        .map(p => '　　' + p);

      $body.innerHTML = paragraphs.map(p => `<p class="para">${charsToSpans(p)}</p>`).join('');

      window.scrollTo(0, 0);
      requestAnimationFrame(() => {
        cacheCharPositions();
      });
    }

    function charsToSpans(text) {
      return Array.from(text).map(c => {
        if (/\s|　/.test(c)) return escapeHtml(c);
        return `<span class="char">${escapeHtml(c)}</span>`;
      }).join('');
    }

    // ---- mouse-dodge ----
    let mouseX = -99999, mouseY = -99999;
    let charCache = [];
    let rafScheduled = false;
    const DODGE_RADIUS = 95;
    const DODGE_MAX = 16;

    function cacheCharPositions() {
      charCache = [];
      const els = document.querySelectorAll('.reader-body .char');
      const sx = window.scrollX, sy = window.scrollY;
      for (const el of els) {
        const r = el.getBoundingClientRect();
        charCache.push({
          el,
          cx: r.left + r.width / 2 + sx,
          cy: r.top + r.height / 2 + sy,
          dodged: false,
        });
      }
      scheduleDodge();
    }

    function scheduleDodge() {
      if (rafScheduled) return;
      rafScheduled = true;
      requestAnimationFrame(updateDodge);
    }

    function updateDodge() {
      rafScheduled = false;
      if (!charCache.length) return;
      const r2 = DODGE_RADIUS * DODGE_RADIUS;
      const minY = window.scrollY - DODGE_RADIUS;
      const maxY = window.scrollY + window.innerHeight + DODGE_RADIUS;
      for (const c of charCache) {
        if (c.cy < minY || c.cy > maxY) {
          if (c.dodged) { c.el.style.transform = ''; c.dodged = false; }
          continue;
        }
        const dx = c.cx - mouseX;
        const dy = c.cy - mouseY;
        const d2 = dx * dx + dy * dy;
        if (d2 > r2) {
          if (c.dodged) { c.el.style.transform = ''; c.dodged = false; }
          continue;
        }
        const d = Math.sqrt(d2) || 0.001;
        const f = 1 - d / DODGE_RADIUS;
        const push = DODGE_MAX * f * f;
        c.el.style.transform = `translate(${(dx / d * push).toFixed(2)}px, ${(dy / d * push).toFixed(2)}px)`;
        c.dodged = true;
      }
    }

    window.addEventListener('mousemove', e => { mouseX = e.pageX; mouseY = e.pageY; scheduleDodge(); });
    window.addEventListener('mouseleave', () => { mouseX = mouseY = -99999; scheduleDodge(); });
    window.addEventListener('scroll', () => {
      const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      $progress.style.width = (window.scrollY / max * 100) + '%';
      scheduleDodge();
    }, { passive: true });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (!$read.hidden) cacheCharPositions();
      }, 120);
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
  </script>
</body>
</html>
