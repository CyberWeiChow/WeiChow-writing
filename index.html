<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>周未写作集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f0;
      --ink: #1a1714;
      --muted: #8a8278;
      --rule: #d8d4cb;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'EB Garamond', 'Noto Serif SC', 'Songti SC', serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
      font-feature-settings: "kern", "liga", "onum";
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><path d='M19.5 2.5a2.4 2.4 0 0 1 3.4 3.4L9.5 19.3 3 21l1.7-6.5z' fill='%231a1714' stroke='%23fafaf7' stroke-width='0.8' stroke-linejoin='round'/><path d='M16.5 5.5l3.4 3.4' stroke='%23fafaf7' stroke-width='0.8'/></svg>") 3 25, auto;
    }
    a { color: inherit; text-decoration: none; }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 120px 32px 160px;
    }

    header {
      margin-bottom: 96px;
    }
    h1 {
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 0.04em;
      margin: 0 0 12px;
      line-height: 1.2;
    }
    .lede {
      color: var(--muted);
      font-size: 15px;
      margin: 0;
      font-style: italic;
      font-family: 'EB Garamond', 'Noto Serif SC', serif;
    }

    .nav {
      display: flex;
      gap: 28px;
      margin: 28px 0 0;
      padding-top: 24px;
      border-top: 1px solid var(--rule);
    }
    .nav a {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }
    .nav a:hover { color: var(--ink); }

    section.cat {
      margin-bottom: 80px;
      scroll-margin-top: 32px;
    }
    section.cat:last-child { margin-bottom: 0; }
    .cat-label {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 28px;
      font-weight: 400;
    }

    .works { list-style: none; padding: 0; margin: 0; }
    .works li { border-top: 1px solid var(--rule); }
    .works li:last-child { border-bottom: 1px solid var(--rule); }

    .work {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: baseline;
      padding: 22px 0;
      transition: padding 0.25s ease;
    }
    .work:hover { padding-left: 12px; }
    .work .title {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.3;
      margin: 0 0 6px;
    }
    .work .desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
      font-style: italic;
    }
    .work .arrow {
      color: var(--muted);
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .work:hover .arrow {
      opacity: 1;
      transform: translateX(4px);
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
      padding: 24px 0;
    }
    footer {
      margin-top: 120px;
      padding-top: 24px;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="site-title">周未写作集</h1>
      <p class="lede" id="site-subtitle">创意写作、财经新闻与文化批评</p>
      <nav class="nav" id="nav"></nav>
    </header>

    <main id="main"></main>

    <footer>WeiChow · MMXXVI</footer>
  </div>

  <script>
    (async () => {
      const $nav = document.getElementById('nav');
      const $main = document.getElementById('main');
      try {
        const manifest = await fetch('./works/manifest.json').then(r => r.json());
        document.title = manifest.site.title;
        document.getElementById('site-title').textContent = manifest.site.title;
        document.getElementById('site-subtitle').textContent = manifest.site.subtitle;

        const categories = manifest.categories || [];
        const works = manifest.works || [];

        const buckets = new Map();
        for (const cat of categories) buckets.set(cat.id, []);
        const uncategorized = [];
        for (const w of works) {
          if (w.category && buckets.has(w.category)) buckets.get(w.category).push(w);
          else uncategorized.push(w);
        }

        const navItems = categories
          .filter(c => buckets.get(c.id).length > 0)
          .map(c => `<a href="#cat-${c.id}">${escapeHtml(c.label)}</a>`);
        if (uncategorized.length) navItems.push(`<a href="#cat-other">其他</a>`);
        $nav.innerHTML = navItems.join('');

        const sections = [];
        for (const cat of categories) {
          const items = buckets.get(cat.id);
          if (!items.length) continue;
          sections.push(renderSection(cat.id, cat.label, items));
        }
        if (uncategorized.length) sections.push(renderSection('other', '其他', uncategorized));

        if (!sections.length) {
          $main.innerHTML = '<div class="empty">尚无作品。</div>';
          return;
        }
        $main.innerHTML = sections.join('');
      } catch (err) {
        $main.innerHTML = `<div class="empty">无法加载作品列表。</div>`;
        console.error(err);
      }
    })();

    function renderSection(id, label, items) {
      return `
        <section class="cat" id="cat-${id}">
          <h2 class="cat-label">${escapeHtml(label)}</h2>
          <ul class="works">
            ${items.map(renderWork).join('')}
          </ul>
        </section>`;
    }

    function renderWork(w) {
      return `
        <li>
          <a class="work" href="read.html?id=${encodeURIComponent(w.id)}">
            <div>
              <h3 class="title">${escapeHtml(w.title)}</h3>
              <p class="desc">${escapeHtml(w.subtitle || '')}</p>
            </div>
            <span class="arrow">→</span>
          </a>
        </li>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
  </script>
</body>
</html>
