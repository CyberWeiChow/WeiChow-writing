<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>阅读</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f0;
      --ink: #1a1714;
      --muted: #8a8278;
      --rule: #d8d4cb;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'EB Garamond', 'Noto Serif SC', 'Songti SC', serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      font-feature-settings: "kern", "liga";
    }
    a { color: inherit; text-decoration: none; }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 40px;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      z-index: 10;
    }
    .topbar a:hover { color: var(--ink); }
    .topbar .center {
      font-style: italic;
      text-transform: none;
      letter-spacing: 0.05em;
      font-size: 14px;
      color: var(--ink);
    }
    .topbar .right { text-align: right; }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 40px;
    }

    .sheet {
      position: relative;
      width: min(760px, 96vw);
      height: min(820px, calc(100vh - 160px));
      padding: 40px 0 56px;
      overflow: hidden;
    }

    #content {
      white-space: pre;
      color: var(--ink);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #content .line { white-space: pre; }
    #content .char {
      display: inline-block;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    #content.flip-out-next { opacity: 0; transform: translateX(-8px); }
    #content.flip-out-prev { opacity: 0; transform: translateX(8px); }
    #content.flip-in-next  { opacity: 0; transform: translateX(8px); }
    #content.flip-in-prev  { opacity: 0; transform: translateX(-8px); }

    .page-num {
      position: absolute;
      bottom: 16px;
      right: 0;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.3em;
      font-variant-numeric: oldstyle-nums;
    }

    .nav-zone {
      position: fixed;
      top: 0; bottom: 0;
      width: 30%;
      cursor: pointer;
      z-index: 5;
    }
    .nav-zone.left { left: 0; }
    .nav-zone.right { right: 0; }

    .arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.25s ease, color 0.25s ease;
      user-select: none;
      z-index: 6;
    }
    .arrow:hover { color: var(--ink); }
    body:hover .arrow { opacity: 0.5; }
    .arrow:hover { opacity: 1; }
    .arrow.left { left: 24px; }
    .arrow.right { right: 24px; }

    .progress {
      position: fixed;
      bottom: 0; left: 0;
      height: 1px;
      background: var(--ink);
      width: 0;
      transition: width 0.3s ease;
      z-index: 11;
      opacity: 0.6;
    }

    .loading {
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
    }

    @media (max-width: 640px) {
      .topbar { padding: 0 20px; font-size: 10px; }
      .topbar .center { font-size: 13px; }
      .stage { padding: 64px 20px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div><a href="index.html">← 返回</a></div>
    <div class="center" id="work-title"></div>
    <div class="right" id="cat-label"></div>
  </div>

  <div class="stage">
    <div class="sheet" id="sheet">
      <div id="content" class="loading">正在排版…</div>
      <div class="page-num" id="page-num"></div>
    </div>
  </div>

  <div class="nav-zone left" id="zone-left"></div>
  <div class="nav-zone right" id="zone-right"></div>
  <div class="arrow left">‹</div>
  <div class="arrow right">›</div>
  <div class="progress" id="progress"></div>

  <script type="module">
    import { prepareWithSegments, layoutWithLines } from 'https://esm.sh/@chenglou/pretext';

    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    if (!id) location.replace('index.html');

    const fontSize = 16;
    const lineHeight = 30;
    const fontFamily = `'EB Garamond', 'Noto Serif SC', 'Songti SC', serif`;
    const font = `${fontSize}px ${fontFamily}`;

    const $sheet = document.getElementById('sheet');
    const $content = document.getElementById('content');
    const $pageNum = document.getElementById('page-num');
    const $title = document.getElementById('work-title');
    const $catLabel = document.getElementById('cat-label');
    const $progress = document.getElementById('progress');

    let allLines = [];
    let pages = [];
    let pageIndex = 0;
    let _rawText = '';

    init().catch(err => {
      $content.classList.remove('loading');
      $content.textContent = '加载失败：' + err.message;
      console.error(err);
    });

    async function init() {
      const manifest = await fetch('./works/manifest.json').then(r => r.json());
      const work = manifest.works.find(w => w.id === id);
      if (!work) throw new Error('找不到作品 ' + id);

      document.title = work.title;
      $title.textContent = work.title;
      const cat = (manifest.categories || []).find(c => c.id === work.category);
      if (cat) $catLabel.textContent = cat.label;

      _rawText = await fetch('./works/' + work.file).then(r => {
        if (!r.ok) throw new Error('读取 ' + work.file + ' 失败');
        return r.text();
      });

      await document.fonts.load(`${fontSize}px "Noto Serif SC"`);
      await document.fonts.load(`${fontSize}px "EB Garamond"`);

      paginate();
      pageIndex = 0;
      $content.classList.remove('loading');
      render('next', true);

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const cursor = pages.slice(0, pageIndex).reduce((n, p) => n + p.length, 0);
          paginate();
          let acc = 0, idx = 0;
          for (let i = 0; i < pages.length; i++) {
            if (acc + pages[i].length > cursor) { idx = i; break; }
            acc += pages[i].length;
          }
          pageIndex = Math.min(idx, pages.length - 1);
          render('next', true);
        }, 120);
      });

      document.getElementById('zone-left').addEventListener('click', prev);
      document.getElementById('zone-right').addEventListener('click', next);
      document.querySelector('.arrow.left').addEventListener('click', prev);
      document.querySelector('.arrow.right').addEventListener('click', next);

      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') prev();
        else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
          e.preventDefault();
          next();
        }
      });

      let touchX = null;
      window.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
      window.addEventListener('touchend', e => {
        if (touchX === null) return;
        const dx = e.changedTouches[0].clientX - touchX;
        touchX = null;
        if (Math.abs(dx) < 40) return;
        if (dx > 0) prev(); else next();
      }, { passive: true });
    }

    function buildLines() {
      const paragraphs = _rawText
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .split(/\n+/)
        .map(p => p.trim())
        .filter(p => p.length > 0)
        .map(p => '　　' + p);

      allLines = [];
      const innerWidth = getContentWidth();
      if (innerWidth <= 0 || paragraphs.length === 0) return;

      for (let i = 0; i < paragraphs.length; i++) {
        const prep = prepareWithSegments(paragraphs[i], font);
        const result = layoutWithLines(prep, innerWidth, lineHeight);
        if (result && result.lines) {
          for (const line of result.lines) allLines.push(line.text);
        }
        if (i < paragraphs.length - 1) allLines.push('');
      }
    }

    function paginate() {
      buildLines();
      const innerHeight = getContentHeight();
      const linesPerPage = Math.max(1, Math.floor(innerHeight / lineHeight));
      pages = [];
      let cur = [];
      for (const ln of allLines) {
        if (cur.length === 0 && ln === '') continue;
        cur.push(ln);
        if (cur.length >= linesPerPage) { pages.push(cur); cur = []; }
      }
      if (cur.length) pages.push(cur);
    }

    function renderChars(text) {
      if (text === '') return '&nbsp;';
      return Array.from(text).map(c => {
        if (c === '　' || c === ' ' || c === '\t') return escapeHtml(c);
        return `<span class="char">${escapeHtml(c)}</span>`;
      }).join('');
    }

    function render(direction, instant) {
      if (!pages.length) return;
      const dir = direction === 'prev' ? 'prev' : 'next';
      const doRender = () => {
        $content.innerHTML = pages[pageIndex]
          .map(t => `<div class="line">${renderChars(t)}</div>`)
          .join('');
        $content.style.font = font;
        $content.style.lineHeight = lineHeight + 'px';
        $pageNum.textContent = `${pageIndex + 1} / ${pages.length}`;
        $progress.style.width = `${((pageIndex + 1) / pages.length) * 100}%`;

        requestAnimationFrame(cacheCharPositions);

        if (!instant) {
          $content.classList.add('flip-in-' + dir);
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              $content.classList.remove('flip-in-' + dir);
            });
          });
        }
      };

      if (instant) { doRender(); return; }
      $content.classList.add('flip-out-' + dir);
      setTimeout(() => {
        $content.classList.remove('flip-out-' + dir);
        doRender();
      }, 180);
    }

    // ---- mouse-dodge interaction ----
    let mouseX = -9999, mouseY = -9999;
    let charCache = [];
    let rafScheduled = false;
    const DODGE_RADIUS = 100;
    const DODGE_MAX = 18;

    function cacheCharPositions() {
      charCache = [];
      const els = $content.querySelectorAll('.char');
      for (const el of els) {
        const r = el.getBoundingClientRect();
        charCache.push({ el, cx: r.left + r.width / 2, cy: r.top + r.height / 2, dodged: false });
      }
      scheduleDodgeUpdate();
    }

    function scheduleDodgeUpdate() {
      if (rafScheduled) return;
      rafScheduled = true;
      requestAnimationFrame(updateDodge);
    }

    function updateDodge() {
      rafScheduled = false;
      const r2 = DODGE_RADIUS * DODGE_RADIUS;
      for (const c of charCache) {
        const dx = c.cx - mouseX;
        const dy = c.cy - mouseY;
        const d2 = dx * dx + dy * dy;
        if (d2 > r2) {
          if (c.dodged) {
            c.el.style.transform = '';
            c.dodged = false;
          }
          continue;
        }
        const d = Math.sqrt(d2) || 0.0001;
        const f = 1 - d / DODGE_RADIUS;
        const push = DODGE_MAX * f * f;
        const tx = (dx / d) * push;
        const ty = (dy / d) * push;
        c.el.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px)`;
        c.dodged = true;
      }
    }

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      scheduleDodgeUpdate();
    });
    window.addEventListener('mouseleave', () => {
      mouseX = mouseY = -9999;
      scheduleDodgeUpdate();
    });
    window.addEventListener('scroll', () => {
      cacheCharPositions();
    }, { passive: true });

    function next() {
      if (pageIndex >= pages.length - 1) return;
      pageIndex++;
      render('next');
    }
    function prev() {
      if (pageIndex <= 0) return;
      pageIndex--;
      render('prev');
    }

    function getContentWidth() {
      return $sheet.clientWidth;
    }
    function getContentHeight() {
      const cs = getComputedStyle($sheet);
      const pageNumReserve = 32;
      return $sheet.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - pageNumReserve;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
  </script>
</body>
</html>
