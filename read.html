<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>阅读</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Noto+Sans+SC:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f0;
      --ink: #1a1714;
      --muted: #8a8278;
      --rule: #d8d4cb;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'EB Garamond', 'Noto Serif SC', 'Songti SC', serif;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "kern", "liga";
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><path d='M19.5 2.5a2.4 2.4 0 0 1 3.4 3.4L9.5 19.3 3 21l1.7-6.5z' fill='%231a1714' stroke='%23fafaf7' stroke-width='0.8' stroke-linejoin='round'/><path d='M16.5 5.5l3.4 3.4' stroke='%23fafaf7' stroke-width='0.8'/></svg>") 3 25, auto;
    }
    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 16px 32px;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(8px);
    }
    .topbar a:hover { color: var(--ink); }
    .topbar .center { text-align: center; }
    .topbar .right  { text-align: right; }

    .progress {
      position: fixed;
      top: 0; left: 0;
      height: 1px;
      background: var(--ink);
      width: 0;
      z-index: 100;
      opacity: 0.5;
    }

    article {
      position: relative;
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 32px 140px;
    }

    .masthead { margin-bottom: 56px; }
    .headline {
      font-family: 'Noto Serif SC', serif;
      font-weight: 500;
      font-size: 30px;
      line-height: 1.35;
      margin: 0 0 14px;
      letter-spacing: 0.01em;
    }
    .lede {
      font-family: 'EB Garamond', 'Noto Serif SC', serif;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      margin: 0 0 14px;
      font-style: italic;
    }
    .byline {
      font-family: 'EB Garamond', serif;
      font-style: italic;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.05em;
      margin: 0;
    }
    .masthead .rule {
      width: 56px;
      height: 1px;
      background: var(--rule);
      margin: 24px 0 0;
    }

    #body {
      color: var(--ink);
    }
    #body .line {
      white-space: pre;
    }
    #body .para-gap {
      height: 0.6em;
    }
    #body .char {
      display: inline-block;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    footer.colophon {
      margin-top: 64px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.4em;
      text-align: center;
      text-transform: uppercase;
    }

    .vert-label {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.18em;
      color: var(--muted);
      opacity: 0.6;
      line-height: 1;
      pointer-events: none;
      display: none;
    }
    .vert-label .en {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      letter-spacing: 0.04em;
    }

    /* ======== NEWS theme accents ======== */
    body.theme-news {
      --bg: #efe8d4;
      --ink: #1f1a14;
      --muted: #7a6a52;
      --rule: #c9b890;
    }
    body.theme-news .topbar {
      font-family: 'Old Standard TT', 'Noto Serif SC', serif;
    }
    body.theme-news .headline {
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 900;
      font-size: 34px;
      line-height: 1.22;
    }
    body.theme-news .lede {
      font-family: 'Noto Sans SC', sans-serif;
      font-style: normal;
      font-weight: 500;
      color: #3a322a;
    }
    body.theme-news .masthead {
      padding-bottom: 22px;
      border-bottom: 3px double var(--ink);
      margin-bottom: 40px;
    }
    body.theme-news .masthead .rule { display: none; }
    body.theme-news .vert-label { display: block; }

    /* ======== CRITICISM theme accents ======== */
    body.theme-criticism {
      --bg: #f3ede0;
      --ink: #1a1714;
      --muted: #6a5f50;
      --rule: #c8bda5;
    }
    body.theme-criticism .headline {
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;
      font-size: 26px;
      line-height: 1.4;
    }
    body.theme-criticism .lede {
      font-family: 'Noto Serif SC', serif;
      font-style: italic;
    }
    body.theme-criticism .vert-label { display: block; }

    @media (max-width: 700px) {
      article { padding: 56px 20px 100px; }
      .vert-label { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <div class="topbar">
    <div><a href="index.html">← 返回</a></div>
    <div class="center" id="topbar-title"></div>
    <div class="right" id="cat-label"></div>
  </div>

  <aside class="vert-label" id="vert-label"></aside>

  <article id="article">
    <header class="masthead" id="masthead"></header>
    <div id="body">
      <p style="color:var(--muted);font-style:italic">正在排版…</p>
    </div>
    <footer class="colophon">— Fin —</footer>
  </article>

  <script type="module">
    import { prepareWithSegments, layoutWithLines } from 'https://esm.sh/@chenglou/pretext';

    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    if (!id) location.replace('index.html');

    const THEMES = {
      creative: {
        fontSize: 17,
        lineHeight: 32,
        fontFamily: `'EB Garamond', 'Noto Serif SC', 'Songti SC', serif`,
        preloadFonts: ['Noto Serif SC', 'EB Garamond'],
        bylinePrefix: '',
        vertLabel: null,
      },
      news: {
        fontSize: 15.5,
        lineHeight: 29,
        fontFamily: `'Old Standard TT', 'Noto Serif SC', 'STSong', serif`,
        preloadFonts: ['Noto Serif SC', 'Old Standard TT', 'Noto Sans SC'],
        bylinePrefix: '记者　',
        bylineSuffix: '　报道',
        vertLabel: { en: 'BUSINESS', cn: '财经报道' },
      },
      criticism: {
        fontSize: 16,
        lineHeight: 31,
        fontFamily: `'EB Garamond', 'Noto Serif SC', 'Songti SC', serif`,
        preloadFonts: ['Noto Serif SC', 'EB Garamond'],
        bylinePrefix: '',
        bylineSuffix: '　著',
        vertLabel: { en: 'Literary Criticism', cn: '文学艺术批评' },
      },
    };

    const $body = document.getElementById('body');
    const $masthead = document.getElementById('masthead');
    const $topbarTitle = document.getElementById('topbar-title');
    const $catLabel = document.getElementById('cat-label');
    const $vert = document.getElementById('vert-label');
    const $progress = document.getElementById('progress');

    let theme, fontSize, lineHeight, font, _rawText = '';

    init().catch(err => {
      $body.innerHTML = `<p style="color:#a55">加载失败：${escapeHtml(err.message)}</p>`;
      console.error(err);
    });

    async function init() {
      const manifest = await fetch('./works/manifest.json').then(r => r.json());
      const work = manifest.works.find(w => w.id === id);
      if (!work) throw new Error('找不到作品 ' + id);

      document.title = work.title;
      $topbarTitle.textContent = work.title;
      const cat = (manifest.categories || []).find(c => c.id === work.category);
      if (cat) $catLabel.textContent = cat.label;

      const themeKey = THEMES[work.category] ? work.category : 'creative';
      theme = THEMES[themeKey];
      document.body.className = 'theme-' + themeKey;
      fontSize = theme.fontSize;
      lineHeight = theme.lineHeight;
      font = `${fontSize}px ${theme.fontFamily}`;

      // ---- masthead ----
      const bylineHTML = `<p class="byline">${escapeHtml((theme.bylinePrefix || '') + '周未' + (theme.bylineSuffix || ''))}</p>`;
      $masthead.innerHTML = `
        <h1 class="headline">${escapeHtml(work.title)}</h1>
        ${work.subtitle ? `<p class="lede">${escapeHtml(work.subtitle)}</p>` : ''}
        ${bylineHTML}
        <div class="rule"></div>
      `;

      // ---- vertical side label ----
      if (theme.vertLabel) {
        $vert.innerHTML = `<span class="en">${escapeHtml(theme.vertLabel.en)}</span>　${escapeHtml(theme.vertLabel.cn)}`;
      }

      // ---- text ----
      _rawText = await fetch('./works/' + work.file).then(r => {
        if (!r.ok) throw new Error('读取 ' + work.file + ' 失败');
        return r.text();
      });

      await Promise.all(theme.preloadFonts.map(f =>
        document.fonts.load(`${fontSize}px "${f}"`)
      ));

      layoutBody();
      cacheCharPositions();

      window.addEventListener('scroll', () => {
        const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        $progress.style.width = (window.scrollY / max * 100) + '%';
        scheduleDodge();
      }, { passive: true });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          layoutBody();
          cacheCharPositions();
        }, 120);
      });
    }

    function layoutBody() {
      const paragraphs = _rawText
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .split(/\n+/)
        .map(p => p.trim().replace(/^[　\s]+/, ''))
        .filter(p => p.length > 0)
        .map(p => '　　' + p);

      const innerWidth = $body.clientWidth;
      if (innerWidth <= 0 || !paragraphs.length) return;

      let html = '';
      for (let i = 0; i < paragraphs.length; i++) {
        const prep = prepareWithSegments(paragraphs[i], font);
        const result = layoutWithLines(prep, innerWidth, lineHeight);
        if (result && result.lines) {
          for (const line of result.lines) {
            html += `<div class="line" style="height:${lineHeight}px;line-height:${lineHeight}px;font:${font}">${charsToSpans(line.text)}</div>`;
          }
        }
        if (i < paragraphs.length - 1) html += `<div class="para-gap"></div>`;
      }
      $body.innerHTML = html;
    }

    function charsToSpans(text) {
      return Array.from(text).map(c => {
        if (/\s|　/.test(c)) return escapeHtml(c);
        return `<span class="char">${escapeHtml(c)}</span>`;
      }).join('');
    }

    // ---- mouse-dodge ----
    let mouseX = -99999, mouseY = -99999;
    let charCache = [];
    let rafScheduled = false;
    const DODGE_RADIUS = 95;
    const DODGE_MAX = 16;

    function cacheCharPositions() {
      charCache = [];
      const els = $body.querySelectorAll('.char');
      const sx = window.scrollX, sy = window.scrollY;
      for (const el of els) {
        const r = el.getBoundingClientRect();
        charCache.push({
          el,
          cx: r.left + r.width / 2 + sx,
          cy: r.top + r.height / 2 + sy,
          dodged: false,
        });
      }
      scheduleDodge();
    }

    function scheduleDodge() {
      if (rafScheduled) return;
      rafScheduled = true;
      requestAnimationFrame(updateDodge);
    }

    function updateDodge() {
      rafScheduled = false;
      const r2 = DODGE_RADIUS * DODGE_RADIUS;
      const minY = window.scrollY - DODGE_RADIUS;
      const maxY = window.scrollY + window.innerHeight + DODGE_RADIUS;
      for (const c of charCache) {
        if (c.cy < minY || c.cy > maxY) {
          if (c.dodged) { c.el.style.transform = ''; c.dodged = false; }
          continue;
        }
        const dx = c.cx - mouseX;
        const dy = c.cy - mouseY;
        const d2 = dx * dx + dy * dy;
        if (d2 > r2) {
          if (c.dodged) { c.el.style.transform = ''; c.dodged = false; }
          continue;
        }
        const d = Math.sqrt(d2) || 0.001;
        const f = 1 - d / DODGE_RADIUS;
        const push = DODGE_MAX * f * f;
        const tx = (dx / d) * push;
        const ty = (dy / d) * push;
        c.el.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px)`;
        c.dodged = true;
      }
    }

    window.addEventListener('mousemove', (e) => {
      mouseX = e.pageX;
      mouseY = e.pageY;
      scheduleDodge();
    });
    window.addEventListener('mouseleave', () => {
      mouseX = mouseY = -99999;
      scheduleDodge();
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
  </script>
</body>
</html>
